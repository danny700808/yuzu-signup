<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>柚子樂器｜管理者下載區</title>
  <style>
    :root{
      --bg:#f5faf7;
      --card:#ffffff;
      --line:#d8e7df;
      --text:#17352b;
      --muted:#5e786d;
      --brand:#208763;
      --brand2:#45b08a;
      --danger:#c74e4e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      background:linear-gradient(180deg,#f4faf7 0%,#f7f3eb 100%);
      color:var(--text);
    }
    .wrap{max-width:1180px;margin:0 auto;padding:22px 14px 40px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:0 14px 34px rgba(22,53,43,.08);
      padding:20px;
    }
    h1{margin:0 0 8px;font-size:30px;line-height:1.15;font-weight:1000}
    .sub{color:var(--muted);line-height:1.7;font-size:14px}
    .topRow,.actionRow,.summaryRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    label{display:block;margin:14px 0 7px;font-size:14px;font-weight:900}
    input,select,button,textarea{font:inherit}
    input,select{
      width:100%;border:1px solid #cadad4;border-radius:14px;padding:12px 13px;background:#fff;color:var(--text)
    }
    .grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:14px;margin-top:16px}
    .btn{
      min-height:46px;padding:0 16px;border:none;border-radius:14px;cursor:pointer;
      background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:1000
    }
    .btn.secondary{background:#eef7f3;color:#1e5f48}
    .btn.danger{background:#fff1f1;color:#a84545}
    .infoBox{margin-top:16px;padding:14px;border:1px solid #deebe5;border-radius:18px;background:#fbfffd}
    .summaryCard{flex:1;min-width:180px;padding:14px 16px;border:1px solid #deebe5;border-radius:18px;background:#fbfffd}
    .summaryCard .k{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.06em}
    .summaryCard .v{margin-top:6px;font-size:24px;font-weight:1000}
    .list{margin-top:18px;display:grid;gap:12px}
    .item{border:1px solid #dfebe6;border-radius:18px;background:#fff;padding:14px}
    .itemTop{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
    .title{font-size:18px;font-weight:1000;line-height:1.5}
    .badge{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:#edf7f2;color:#215946;font-weight:900;font-size:12px}
    .meta{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.8}
    .pillRow{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#f4f8f6;border:1px solid #deebe5;font-size:12px;font-weight:800}
    .secTitle{margin-top:12px;font-size:13px;font-weight:1000;color:#2c5b4a}
    .textBlock{margin-top:6px;white-space:pre-wrap;line-height:1.7}
    .audioList{margin-top:8px;display:grid;gap:8px}
    .audioRow{padding:10px 12px;border:1px solid #e3ece8;border-radius:14px;background:#fcfffe}
    .audioRow a{color:#1767c1;text-decoration:none;font-weight:900}
    .empty{margin-top:16px;padding:18px;border:1px dashed #d5e5dd;border-radius:18px;color:var(--muted);text-align:center}
    .err{color:#b44040;font-weight:900;margin-top:12px;white-space:pre-wrap}
    .ok{color:#217a57;font-weight:900;margin-top:12px;white-space:pre-wrap}
    @media (max-width:860px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>管理者下載區</h1>
    <div class="sub">這一頁是給管理者快速整理用。輸入密碼後，可以下載 Excel、把全部音檔打包成 ZIP，也可以一鍵清空報名資料。</div>

    <div class="grid">
      <div>
        <label>管理者密碼</label>
        <input id="pwd" type="password" placeholder="請輸入管理者密碼">
      </div>
      <div>
        <label>場次篩選</label>
        <select id="sessionFilter">
          <option value="">全部場次</option>
          <option value="下午場 13:00~16:00">下午場 13:00~16:00</option>
          <option value="晚上場 17:30~20:30">晚上場 17:30~20:30</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <div class="topRow">
          <button class="btn" id="btnLoad" type="button">載入管理資料</button>
          <a class="btn secondary" href="program.html">回節目單</a>
        </div>
      </div>
    </div>

    <div class="actionRow" style="margin-top:16px;">
      <button class="btn secondary" id="btnExcel" type="button">下載 Excel</button>
      <button class="btn secondary" id="btnAudioZip" type="button">下載全部音檔 ZIP</button>
      <button class="btn danger" id="btnClearData" type="button">一鍵清空報名資料</button>
      <button class="btn danger" id="btnClearAll" type="button">清空資料＋刪除雲端音檔</button>
    </div>
    <div class="infoBox">
      <div style="font-weight:900;">排序與衝突規則</div>
      <div class="sub" style="margin-top:6px;">
        1. 以「希望與誰排在一起」優先。<br>
        2. 若「排在一起」和「靠前 / 靠後」衝突，以排在一起為主。<br>
        3. 同級衝突時，以先報名者為主；另一方偏好降為參考。<br>
        4. 下載音檔 ZIP 時，會依場次自動分成「下午場 / 晚上場」資料夾，檔名用「表演者名稱_曲目」命名。
      </div>
    </div>

    <div class="summaryRow" id="summaryRow" style="margin-top:16px; display:none;">
      <div class="summaryCard"><div class="k">目前組數</div><div class="v" id="sumCount">0</div></div>
      <div class="summaryCard"><div class="k">有音檔的首數</div><div class="v" id="sumAudio">0</div></div>
      <div class="summaryCard"><div class="k">有設備需求的組數</div><div class="v" id="sumEquip">0</div></div>
    </div>

    <div id="msg" class="sub" style="margin-top:14px;">請先輸入管理者密碼，再按「載入管理資料」。</div>
    <div id="list" class="list"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVoYSfoCMhRb2ldlGNLjHas7we5PHEjeAmxgxPUiYy-yuV4cFgPlqTR6nPc-PC8-c/exec";
  var state = { password:"", session:"", items:[] };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function jsonp(url){
    return new Promise(function(resolve, reject){
      var cb = "cb_" + Math.random().toString(36).slice(2);
      var s = document.createElement("script");
      var timer = setTimeout(function(){ cleanup(); reject(new Error("timeout")); }, 15000);
      function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = function(data){ cleanup(); resolve(data); };
      s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cb;
      s.onerror = function(){ cleanup(); reject(new Error("load error")); };
      document.body.appendChild(s);
    });
  }

  function msg(text, cls){
    var el = document.getElementById("msg");
    el.className = cls || "sub";
    el.textContent = text || "";
  }


  function downloadBlob(fileName, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function safeName(s){
    s = String(s == null ? "" : s).trim();
    if(!s) return "未命名";
    return s.replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, " ").trim();
  }

  function sessionFolder(session){
    return String(session || "").indexOf("下午") >= 0 ? "下午場" : (String(session || "").indexOf("晚上") >= 0 ? "晚上場" : "其他場次");
  }

  function performerMainName(it){
    var raw = String(it.performerDisplay || "").replace(/\n+/g, " ").trim();
    return safeName(raw || "未命名表演者");
  }

  function buildExcelHtml(items){
    var rows = [['順序','場次','表演項目','表演者','團名','指導老師','老師一起','希望排一起','靠前','靠後','曲目1','曲目2','曲目3','設備需求','設備需求補充','備註','報名編號']];
    items.forEach(function(it){
      rows.push([
        it.order || '',
        it.session || '',
        it.type || '',
        String(it.performerDisplay || '').replace(/\n/g, '／'),
        it.groupName || '',
        it.teacherName || '',
        it.teacherJoinText || '',
        it.preferredWith || '',
        it.front ? '是' : '',
        it.back ? '是' : '',
        (it.songs || [])[0] || '',
        (it.songs || [])[1] || '',
        (it.songs || [])[2] || '',
        (it.equipmentList || []).join('、'),
        it.equipmentExtra || '',
        it.note || '',
        it.regId || ''
      ]);
    });

    var html = '<html><head><meta charset="utf-8"></head><body><table border="1">';
    rows.forEach(function(row, ri){
      html += '<tr>' + row.map(function(cell){
        var tag = ri === 0 ? 'th' : 'td';
        return '<' + tag + '>' + esc(cell) + '</' + tag + '>';
      }).join('') + '</tr>';
    });
    html += '</table></body></html>';
    return html;
  }

  async function downloadExcel(){
    if(!needItems()) return;
    var html = buildExcelHtml(state.items);
    var blob = new Blob(["\ufeff" + html], { type: "application/vnd.ms-excel;charset=utf-8" });
    downloadBlob("管理資料.xls", blob);
  }

  async function downloadAudioZip(){
    if(!needItems()) return;
    if(typeof JSZip === "undefined"){
      msg("ZIP 套件尚未載入完成，請稍後再試。", "err");
      return;
    }
    msg("正在整理音檔 ZIP，請稍候…", "sub");
    try{
      var zip = new JSZip();
      var used = {};
      var total = 0;
      for(var i=0;i<state.items.length;i++){
        var it = state.items[i];
        var folderName = sessionFolder(it.session);
        var folder = zip.folder(folderName);
        var baseName = performerMainName(it);
        var audioFiles = it.audioFiles || [];
        for(var j=0;j<audioFiles.length;j++){
          var a = audioFiles[j] || {};
          if(!a.url) continue;
          var songName = safeName(a.song || ("第" + (a.slot || (j+1)) + "首"));
          var fileName = baseName + "_" + songName + ".mp3";
          var key = folderName + "/" + fileName;
          var seq = 2;
          while(used[key]){
            fileName = baseName + "_" + songName + "_" + seq + ".mp3";
            key = folderName + "/" + fileName;
            seq++;
          }
          used[key] = true;
          var resp = await fetch(a.url);
          if(!resp.ok) throw new Error("抓取音檔失敗：" + fileName);
          var buf = await resp.arrayBuffer();
          folder.file(fileName, buf);
          total++;
        }
      }
      if(!total) throw new Error("目前沒有可下載的音檔。");
      var blob = await zip.generateAsync({ type:"blob" });
      downloadBlob("柚子樂器_全部音檔.zip", blob);
      msg("✅ 已產生 ZIP，共 " + total + " 首音檔。", "ok");
    }catch(e){
      msg("下載 ZIP 失敗：" + e.message, "err");
    }
  }

  async function clearAll(deleteCloud){
    var password = document.getElementById("pwd").value.trim();
    if(!password){
      msg("請先輸入管理者密碼。", "err");
      return;
    }
    var step1 = window.prompt(deleteCloud ? "最後確認：請輸入 CLEAR-YUZU-ALL 才會清空資料並刪除雲端音檔" : "最後確認：請輸入 CLEAR-YUZU-ALL 才會清空所有報名資料");
    if(step1 !== "CLEAR-YUZU-ALL"){
      msg("已取消：確認文字不正確或未輸入。", "err");
      return;
    }
    var step2 = window.confirm(deleteCloud ? "這個動作會清空工作表，並嘗試刪除 Cloudinary 音檔。確定繼續？" : "這個動作會清空工作表第 2 列以下所有報名資料。確定繼續？");
    if(!step2){
      msg("已取消清空動作。", "err");
      return;
    }

    msg("清空中…", "sub");
    try{
      var url = SCRIPT_URL
        + "?mode=adminClearAll"
        + "&password=" + encodeURIComponent(password)
        + "&confirmText=" + encodeURIComponent("CLEAR-YUZU-ALL")
        + "&deleteCloud=" + (deleteCloud ? "1" : "0");
      var j = await jsonp(url);
      if(!j || !j.ok) throw new Error((j && j.error) || "清空失敗");
      state.items = [];
      render([]);
      msg("✅ 清空完成。已清空 " + (j.clearedRows || 0) + " 筆" + (deleteCloud ? ("，已嘗試刪除雲端音檔 " + (j.deletedCloudCount || 0) + " 個") : "") + "。", "ok");
    }catch(e){
      msg("清空失敗：" + e.message, "err");
    }
  }

  function render(items){
    var list = document.getElementById("list");
    list.innerHTML = "";
    document.getElementById("summaryRow").style.display = items.length ? "flex" : "none";

    var audioCount = 0;
    var equipCount = 0;
    items.forEach(function(it){
      audioCount += (it.audioFiles || []).length;
      if((it.equipmentList || []).length || it.equipmentExtra || it.note) equipCount += 1;
    });
    document.getElementById("sumCount").textContent = String(items.length);
    document.getElementById("sumAudio").textContent = String(audioCount);
    document.getElementById("sumEquip").textContent = String(equipCount);

    if(!items.length){
      list.innerHTML = '<div class="empty">目前沒有可顯示的資料。</div>';
      return;
    }

    items.forEach(function(it){
      var audioHtml = (it.audioFiles || []).map(function(a){
        return '<div class="audioRow">'
          + '<div><b>第 ' + esc(a.slot) + ' 首</b>｜' + esc(a.song || '') + '</div>'
          + '<div style="margin-top:6px;">' + (a.url ? ('<a href="' + esc(a.url) + '" target="_blank">' + esc(a.name || a.url) + '</a>') : '<span class="sub">未附音檔</span>') + '</div>'
          + '</div>';
      }).join('');
      if(!audioHtml) audioHtml = '<div class="audioRow">未附音檔</div>';

      var equipText = (it.equipmentList || []).join("、") || "無";
      var card = document.createElement("div");
      card.className = "item";
      card.innerHTML = ''
        + '<div class="itemTop">'
          + '<div>'
            + '<div class="title">' + esc(it.order) + '. ' + esc(it.performerDisplay || '未命名').replace(/\n/g, '<br>') + '</div>'
            + '<div class="meta">場次：' + esc(it.session) + '｜曲目：' + esc((it.songs || []).join('／')) + '</div>'
          + '</div>'
          + '<div class="badge">' + esc(it.type || '未分類') + '</div>'
        + '</div>'
        + '<div class="pillRow">'
          + '<span class="pill">指導老師：' + esc(it.teacherName || '未填') + '</span>'
          + '<span class="pill">希望排一起：' + esc(it.preferredWith || '無') + '</span>'
        + '</div>'
        + '<div class="secTitle">設備需求</div>'
        + '<div class="textBlock">' + esc(equipText) + (it.equipmentExtra ? ('\n補充：' + esc(it.equipmentExtra)) : '') + (it.note ? ('\n備註：' + esc(it.note)) : '') + '</div>'
        + '<div class="secTitle">音檔</div>'
        + '<div class="audioList">' + audioHtml + '</div>';
      list.appendChild(card);
    });
  }

  async function loadData(){
    var password = document.getElementById("pwd").value.trim();
    var session = document.getElementById("sessionFilter").value.trim();
    if(!password){
      msg("請先輸入管理者密碼。", "err");
      return;
    }

    state.password = password;
    state.session = session;
    msg("載入中…", "sub");
    try{
      var url = SCRIPT_URL + "?mode=adminExport&password=" + encodeURIComponent(password) + "&session=" + encodeURIComponent(session);
      var j = await jsonp(url);
      if(!j || !j.ok) throw new Error((j && j.error) || "載入失敗");
      state.items = j.items || [];
      render(state.items);
      msg("✅ 管理資料已載入。", "ok");
    }catch(e){
      state.items = [];
      render([]);
      msg("載入失敗：" + e.message, "err");
    }
  }

  function needItems(){
    if(!state.items.length){
      msg("請先載入管理資料後再下載。", "err");
      return false;
    }
    return true;
  }

  document.getElementById("btnLoad").addEventListener("click", loadData);
  document.getElementById("btnExcel").addEventListener("click", downloadExcel);
  document.getElementById("btnAudioZip").addEventListener("click", downloadAudioZip);
  document.getElementById("btnClearData").addEventListener("click", function(){ clearAll(false); });
  document.getElementById("btnClearAll").addEventListener("click", function(){ clearAll(true); });
</script>
</body>
</html>
