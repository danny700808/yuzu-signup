<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>柚子樂器｜管理者下載區</title>
  <style>
    :root{
      --bg:#f5faf7;
      --card:#ffffff;
      --line:#d8e7df;
      --text:#17352b;
      --muted:#5e786d;
      --brand:#208763;
      --brand2:#45b08a;
      --danger:#c74e4e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      background:linear-gradient(180deg,#f4faf7 0%,#f7f3eb 100%);
      color:var(--text);
    }
    .wrap{max-width:1180px;margin:0 auto;padding:22px 14px 40px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:0 14px 34px rgba(22,53,43,.08);
      padding:20px;
    }
    h1{margin:0 0 8px;font-size:30px;line-height:1.15;font-weight:1000}
    .sub{color:var(--muted);line-height:1.7;font-size:14px}
    .topRow,.actionRow,.summaryRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    label{display:block;margin:14px 0 7px;font-size:14px;font-weight:900}
    input,select,button,textarea{font:inherit}
    input,select{
      width:100%;border:1px solid #cadad4;border-radius:14px;padding:12px 13px;background:#fff;color:var(--text)
    }
    .grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:14px;margin-top:16px}
    .btn{
      min-height:46px;padding:0 16px;border:none;border-radius:14px;cursor:pointer;
      background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:1000
    }
    .btn.secondary{background:#eef7f3;color:#1e5f48}
    .btn.danger{background:#fff1f1;color:#a84545}
    .infoBox{margin-top:16px;padding:14px;border:1px solid #deebe5;border-radius:18px;background:#fbfffd}
    .summaryCard{flex:1;min-width:180px;padding:14px 16px;border:1px solid #deebe5;border-radius:18px;background:#fbfffd}
    .summaryCard .k{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.06em}
    .summaryCard .v{margin-top:6px;font-size:24px;font-weight:1000}
    .list{margin-top:18px;display:grid;gap:12px}
    .item{border:1px solid #dfebe6;border-radius:18px;background:#fff;padding:14px}
    .itemTop{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
    .title{font-size:18px;font-weight:1000;line-height:1.5}
    .badge{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:#edf7f2;color:#215946;font-weight:900;font-size:12px}
    .meta{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.8}
    .pillRow{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#f4f8f6;border:1px solid #deebe5;font-size:12px;font-weight:800}
    .secTitle{margin-top:12px;font-size:13px;font-weight:1000;color:#2c5b4a}
    .textBlock{margin-top:6px;white-space:pre-wrap;line-height:1.7}
    .audioList{margin-top:8px;display:grid;gap:8px}
    .audioRow{padding:10px 12px;border:1px solid #e3ece8;border-radius:14px;background:#fcfffe}
    .audioRow a{color:#1767c1;text-decoration:none;font-weight:900}
    .empty{margin-top:16px;padding:18px;border:1px dashed #d5e5dd;border-radius:18px;color:var(--muted);text-align:center}
    .err{color:#b44040;font-weight:900;margin-top:12px;white-space:pre-wrap}
    .ok{color:#217a57;font-weight:900;margin-top:12px;white-space:pre-wrap}
    .adminGate{max-width:540px;margin:0 auto;}
    .hidden{display:none !important;}
    @media (max-width:860px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card adminGate">
    <h1>管理者下載</h1>

    <div class="grid" style="grid-template-columns:1fr auto;align-items:end;">
      <div>
        <label>管理者密碼</label>
        <input id="pwd" type="password" placeholder="請輸入管理者密碼">
      </div>
      <div>
        <label>&nbsp;</label>
        <div class="topRow">
          <button class="btn" id="btnLoad" type="button">進入</button>
          <a class="btn secondary" href="program.html">回節目單</a>
        </div>
      </div>
    </div>

    <div id="adminPanel" class="hidden">
      <div class="grid" style="margin-top:16px;">
        <div>
          <label>場次篩選</label>
          <select id="sessionFilter">
            <option value="">全部場次</option>
            <option value="下午場 13:00~16:00">下午場 13:00~16:00</option>
            <option value="晚上場 17:30~20:30">晚上場 17:30~20:30</option>
          </select>
        </div>
        <div></div><div></div>
      </div>

      <div class="actionRow" style="margin-top:16px;">
        <button class="btn secondary" id="btnExcelPreview" type="button">查看 A4 清單</button>
        <button class="btn secondary" id="btnExcelPrint" type="button">直接列印 A4</button>
        <button class="btn secondary" id="btnAudioZip" type="button">下載全部音檔 ZIP</button>
        <button class="btn danger" id="btnClearData" type="button">一鍵清空報名資料</button>
        <button class="btn danger" id="btnClearAll" type="button" disabled title="成果展與主系統共用雲端空間，為避免誤刪其他資料，暫停自動刪除。">雲端音檔清理（安全暫停）</button>
      </div>
      <div class="infoBox">
        <div style="font-weight:900;">排序與衝突規則</div>
        <div class="sub" style="margin-top:6px;">
          1. 若有填寫「希望安排在誰附近」，系統會盡量安排在對方前後 1～3 組內。<br>
          2. 若「附近安排」和「靠前 / 靠後」衝突，以附近安排優先。<br>
          3. 同級衝突時，以先報名者為主；另一方偏好降為參考。<br>
          4. A4 清單可選擇「查看」或「直接列印」，都會用目前節目排序輸出。
        </div>
      </div>

      <div class="summaryRow" id="summaryRow" style="margin-top:16px; display:none;">
        <div class="summaryCard"><div class="k">目前組數</div><div class="v" id="sumCount">0</div></div>
        <div class="summaryCard"><div class="k">有音檔的首數</div><div class="v" id="sumAudio">0</div></div>
        <div class="summaryCard"><div class="k">有設備需求的組數</div><div class="v" id="sumEquip">0</div></div>
      </div>
    </div>

    <div id="msg" class="sub" style="margin-top:14px;">請輸入管理者密碼後再進入。</div>
    <div id="list" class="list hidden"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVoYSfoCMhRb2ldlGNLjHas7we5PHEjeAmxgxPUiYy-yuV4cFgPlqTR6nPc-PC8-c/exec";
  var ADMIN_CLEAR_CONFIRM_TEXT = "YUZU-CLEAR-ALL";
  var AUDIO_DOWNLOAD_CONCURRENCY = 3;
  var state = { password:"", session:"", items:[] };
  var adminPanel = document.getElementById("adminPanel");
  var listEl = document.getElementById("list");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function jsonp(url){
    return new Promise(function(resolve, reject){
      var cb = "cb_" + Math.random().toString(36).slice(2);
      var s = document.createElement("script");
      var timer = setTimeout(function(){ cleanup(); reject(new Error("timeout")); }, 15000);
      function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = function(data){ cleanup(); resolve(data); };
      s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cb;
      s.onerror = function(){ cleanup(); reject(new Error("load error")); };
      document.body.appendChild(s);
    });
  }

  function msg(text, cls){
    var el = document.getElementById("msg");
    el.className = cls || "sub";
    el.textContent = text || "";
  }


  function downloadBlob(fileName, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function safeName(s){
    s = String(s == null ? "" : s).trim();
    if(!s) return "未命名";
    return s.replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, " ").trim();
  }

  function safeAudioUrl(raw){
    try{
      var url = new URL(String(raw == null ? "" : raw).trim());
      var isCloudinary = url.hostname.toLowerCase() === "res.cloudinary.com";
      var isDefaultHttpsPort = !url.port || url.port === "443";
      if(url.protocol !== "https:" || !isCloudinary || !isDefaultHttpsPort || url.username || url.password) return "";
      return url.href;
    }catch(e){
      return "";
    }
  }

  function formatMegabytes(bytes){
    return (Number(bytes || 0) / 1024 / 1024).toFixed(2);
  }

  function sessionFolder(session){
    return String(session || "").indexOf("下午") >= 0 ? "下午場" : (String(session || "").indexOf("晚上") >= 0 ? "晚上場" : "其他場次");
  }

  function performerMainName(it){
    var raw = String(it.performerDisplay || "").replace(/\n+/g, " ").trim();
    return safeName(raw || "未命名表演者");
  }

  function shortSessionName(session){
    session = String(session || '');
    if(session.indexOf('下午') >= 0) return '下午場';
    if(session.indexOf('晚上') >= 0) return '晚上場';
    return session || '未分類';
  }

  function buildExcelHtml(items, autoPrint){
    var grouped = {};
    items.forEach(function(it){
      var key = shortSessionName(it.session);
      if(!grouped[key]) grouped[key] = [];
      grouped[key].push(it);
    });

    function td(v, cls){ return '<td class="' + (cls||'') + '">' + esc(v == null ? '' : v).replace(/\n/g,'<br>') + '</td>'; }
    function tableFor(title, list){
      var html = '<h2>' + esc(title) + '</h2>';
      html += '<table><thead><tr>'
        + '<th style="width:52px;">順序</th>'
        + '<th style="width:88px;">場次</th>'
        + '<th style="width:110px;">表演項目</th>'
        + '<th>表演者</th>'
        + '<th style="width:74px;">老師一起</th>'
        + '<th>曲目</th>'
        + '<th>設備需求</th>'
        + '<th>設備需求補充／其他需求</th>'
        + '</tr></thead><tbody>';
      (list || []).forEach(function(it){
        var songText = (it.songs || []).map(function(s, idx){ return (idx + 1) + '. ' + s; }).join('\n');
        var equipText = (it.equipmentList || []).join('、') || '無';
        html += '<tr>'
          + td(it.order || '', 'c')
          + td(shortSessionName(it.session), 'c')
          + td(it.type || '')
          + td(String(it.performerDisplay || '').replace(/\n/g, '\n'))
          + td(it.teacherJoin ? '是' : '否', 'c')
          + td(songText)
          + td(equipText)
          + td(it.equipmentExtra || '')
          + '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    var printScript = autoPrint
      ? '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},250);});<\/script>'
      : '';

    var html = '<!doctype html><html><head><meta charset="utf-8"><title>柚子樂器管理清單</title><style>'
      + '@page{size:A4 portrait;margin:10mm;}body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17352b;margin:0;font-size:12px;line-height:1.5;}h1{font-size:20px;margin:0 0 6px;}h2{font-size:16px;margin:16px 0 8px;} .sub{color:#5e786d;margin-bottom:8px;}table{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:12px;}th,td{border:1px solid #9fb8ae;padding:6px 7px;vertical-align:top;word-break:break-word;}th{background:#eef7f3;font-weight:900;text-align:left;}td.c{text-align:center;} .note{margin-top:8px;color:#5e786d;font-size:11px;} .topbar{margin:0 0 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;} .printBtn{display:inline-block;padding:8px 12px;border-radius:10px;background:#208763;color:#fff;text-decoration:none;font-weight:900;} @media print {.topbar{display:none;}} </style></head><body>'
      + '<div class="topbar"><div><h1 style="margin:0;">柚子樂器成果展管理清單</h1><div class="sub" style="margin:4px 0 0;">依目前節目排序輸出，可直接用 A4 列印。</div></div><a class="printBtn" href="#" onclick="window.print();return false;">列印此頁</a></div>'
      + tableFor('下午場', grouped['下午場'] || [])
      + tableFor('晚上場', grouped['晚上場'] || [])
      + printScript
      + '</body></html>';
    return html;
  }

  function openA4Page(autoPrint){
    if(!needItems()) return;
    var html = buildExcelHtml(state.items, !!autoPrint);
    var w = window.open('', '_blank');
    if(!w){
      msg("瀏覽器擋住新視窗，請允許跳出視窗後再試。", "err");
      return;
    }
    w.document.open();
    w.document.write(html);
    w.document.close();
  }

  async function downloadAudioZip(){
    if(!needItems()) return;
    if(typeof JSZip === "undefined"){
      msg("ZIP 套件尚未載入完成，請稍後再試。", "err");
      return;
    }
    var button = document.getElementById("btnAudioZip");
    if(button.disabled) return;
    button.disabled = true;
    msg("正在整理音檔 ZIP，請稍候…", "sub");
    try{
      var zip = new JSZip();
      var used = {};
      var jobs = [];
      for(var i=0;i<state.items.length;i++){
        var it = state.items[i];
        var folderName = sessionFolder(it.session);
        var folder = zip.folder(folderName);
        var baseName = performerMainName(it);
        var audioFiles = it.audioFiles || [];
        for(var j=0;j<audioFiles.length;j++){
          var a = audioFiles[j] || {};
          if(!a.url) continue;
          var songName = safeName(a.song || ("第" + (a.slot || (j+1)) + "首"));
          var orderPrefix = it.order ? String(it.order).padStart(2, "0") + "_" : "";
          var fileName = orderPrefix + baseName + "_" + songName + ".mp3";
          var key = folderName + "/" + fileName;
          var seq = 2;
          while(used[key]){
            fileName = orderPrefix + baseName + "_" + songName + "_" + seq + ".mp3";
            key = folderName + "/" + fileName;
            seq++;
          }
          used[key] = true;
          jobs.push({
            folder: folder,
            fileName: fileName,
            url: safeAudioUrl(a.url)
          });
        }
      }
      if(!jobs.length) throw new Error("目前沒有可下載的音檔。");

      var nextIndex = 0;
      var completed = 0;
      var successCount = 0;
      var downloadedBytes = 0;
      var failures = [];

      async function worker(){
        while(nextIndex < jobs.length){
          var job = jobs[nextIndex++];
          try{
            if(!job.url) throw new Error("網址不是允許的 Cloudinary HTTPS 來源");
            var resp = await fetch(job.url);
            if(!resp.ok) throw new Error("HTTP " + resp.status);
            var buf = await resp.arrayBuffer();
            job.folder.file(job.fileName, buf);
            successCount++;
            downloadedBytes += buf.byteLength;
          }catch(e){
            failures.push(job.fileName + "（" + ((e && e.message) || "未知錯誤") + "）");
          }finally{
            completed++;
            msg(
              "正在下載音檔：" + completed + "/" + jobs.length
                + "，已取得 " + formatMegabytes(downloadedBytes) + " MB"
                + (failures.length ? "，失敗 " + failures.length + " 首" : ""),
              "sub"
            );
          }
        }
      }

      var workers = [];
      var workerCount = Math.min(AUDIO_DOWNLOAD_CONCURRENCY, jobs.length);
      for(var w=0;w<workerCount;w++) workers.push(worker());
      await Promise.all(workers);

      if(!successCount){
        throw new Error("所有音檔皆下載失敗（" + failures.length + " 首）。\n" + failures.join("\n"));
      }

      msg(
        "正在建立 ZIP：已完成 " + completed + "/" + jobs.length
          + "，共 " + formatMegabytes(downloadedBytes) + " MB。",
        "sub"
      );
      var blob = await zip.generateAsync({ type:"blob" });
      downloadBlob("柚子樂器_全部音檔.zip", blob);
      var resultText = (failures.length ? "⚠️" : "✅")
        + " 已產生 ZIP，成功 " + successCount + "/" + jobs.length + " 首，共 "
        + formatMegabytes(downloadedBytes) + " MB；失敗 " + failures.length + " 首。";
      if(failures.length) resultText += "\n失敗檔案：\n" + failures.join("\n");
      msg(resultText, failures.length ? "err" : "ok");
    }catch(e){
      msg("下載 ZIP 失敗：" + e.message, "err");
    }finally{
      button.disabled = false;
    }
  }

  async function clearAll(deleteCloud){
    if(deleteCloud){
      msg("為避免影響共用雲端空間，音檔自動刪除目前已安全暫停；報名資料仍可使用左側按鈕清空。", "err");
      return;
    }
    var password = document.getElementById("pwd").value.trim();
    if(!password){
      msg("請先輸入管理者密碼。", "err");
      return;
    }
    var step1 = window.prompt(deleteCloud ? ("最後確認：請輸入 " + ADMIN_CLEAR_CONFIRM_TEXT + " 才會清空資料並刪除雲端音檔") : ("最後確認：請輸入 " + ADMIN_CLEAR_CONFIRM_TEXT + " 才會清空所有報名資料"));
    if(step1 !== ADMIN_CLEAR_CONFIRM_TEXT){
      msg("已取消：確認文字不正確或未輸入。", "err");
      return;
    }
    var step2 = window.confirm(deleteCloud ? "這個動作會清空工作表，並嘗試刪除 Cloudinary 音檔。確定繼續？" : "這個動作會清空工作表第 2 列以下所有報名資料。確定繼續？");
    if(!step2){
      msg("已取消清空動作。", "err");
      return;
    }

    msg("清空中…", "sub");
    try{
      var url = SCRIPT_URL
        + "?mode=adminClearAll"
        + "&password=" + encodeURIComponent(password)
        + "&confirmText=" + encodeURIComponent(ADMIN_CLEAR_CONFIRM_TEXT)
        + "&deleteCloud=" + (deleteCloud ? "1" : "0");
      var j = await jsonp(url);
      if(!j || !j.ok) throw new Error((j && j.error) || "清空失敗");
      state.items = [];
      render([]);
      msg("✅ 清空完成。已清空 " + (j.clearedRows || 0) + " 筆" + (deleteCloud ? ("，已嘗試刪除雲端音檔 " + (j.deletedCloudCount || 0) + " 個") : "") + "。", "ok");
    }catch(e){
      msg("清空失敗：" + e.message, "err");
    }
  }

  function render(items){
    adminPanel.classList.remove("hidden");
    listEl.classList.remove("hidden");
    var list = listEl;
    list.innerHTML = "";
    document.getElementById("summaryRow").style.display = items.length ? "flex" : "none";

    var audioCount = 0;
    var equipCount = 0;
    items.forEach(function(it){
      audioCount += (it.audioFiles || []).length;
      if((it.equipmentList || []).length || it.equipmentExtra || it.note) equipCount += 1;
    });
    document.getElementById("sumCount").textContent = String(items.length);
    document.getElementById("sumAudio").textContent = String(audioCount);
    document.getElementById("sumEquip").textContent = String(equipCount);

    if(!items.length){
      list.innerHTML = '<div class="empty">目前沒有可顯示的資料。</div>';
      return;
    }

    items.forEach(function(it){
      var audioHtml = (it.audioFiles || []).map(function(a){
        var audioUrl = safeAudioUrl(a.url);
        var audioLink = !a.url
          ? '<span class="sub">未附音檔</span>'
          : (audioUrl
              ? ('<a href="' + esc(audioUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(a.name || audioUrl) + '</a>')
              : '<span class="err">音檔網址無效或非允許來源</span>');
        return '<div class="audioRow">'
          + '<div><b>第 ' + esc(a.slot) + ' 首</b>｜' + esc(a.song || '') + '</div>'
          + '<div style="margin-top:6px;">' + audioLink + '</div>'
          + '</div>';
      }).join('');
      if(!audioHtml) audioHtml = '<div class="audioRow">未附音檔</div>';

      var equipText = (it.equipmentList || []).join("、") || "無";
      var card = document.createElement("div");
      card.className = "item";
      card.innerHTML = ''
        + '<div class="itemTop">'
          + '<div>'
            + '<div class="title">' + esc(it.order) + '. ' + esc(it.performerDisplay || '未命名').replace(/\n/g, '<br>') + '</div>'
            + '<div class="meta">場次：' + esc(it.session) + '｜曲目：' + esc((it.songs || []).join('／')) + '</div>'
          + '</div>'
          + '<div class="badge">' + esc(it.type || '未分類') + '</div>'
        + '</div>'
        + '<div class="pillRow">'
          + '<span class="pill">老師一起：' + esc(it.teacherJoin ? '是' : '否') + '</span>'
        + '</div>'
        + '<div class="secTitle">設備需求</div>'
        + '<div class="textBlock">' + esc(equipText) + (it.equipmentExtra ? ('\n補充／其他需求：' + esc(it.equipmentExtra)) : '') + '</div>'
        + '<div class="secTitle">音檔</div>'
        + '<div class="audioList">' + audioHtml + '</div>';
      list.appendChild(card);
    });
  }

  async function loadData(){
    var password = document.getElementById("pwd").value.trim();
    var session = document.getElementById("sessionFilter").value.trim();
    if(!password){
      msg("請先輸入管理者密碼。", "err");
      return;
    }

    state.password = password;
    state.session = session;
    msg("載入中…", "sub");
    try{
      var url = SCRIPT_URL + "?mode=adminExport&password=" + encodeURIComponent(password) + "&session=" + encodeURIComponent(session);
      var j = await jsonp(url);
      if(!j || !j.ok) throw new Error((j && j.error) || "載入失敗");
      state.items = j.items || [];
      render(state.items);
      msg("✅ 管理資料已載入。", "ok");
    }catch(e){
      state.items = [];
      render([]);
      msg("載入失敗：" + e.message, "err");
    }
  }

  function needItems(){
    if(!state.items.length){
      msg("請先載入管理資料後再下載。", "err");
      return false;
    }
    return true;
  }

  document.getElementById("btnLoad").addEventListener("click", loadData);
  document.getElementById("btnExcelPreview").addEventListener("click", function(){ openA4Page(false); });
  document.getElementById("btnExcelPrint").addEventListener("click", function(){ openA4Page(true); });
  document.getElementById("btnAudioZip").addEventListener("click", downloadAudioZip);
  document.getElementById("btnClearData").addEventListener("click", function(){ clearAll(false); });
  document.getElementById("btnClearAll").addEventListener("click", function(){ clearAll(true); });
</script>
</body>
</html>
