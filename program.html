<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>柚子樂器音樂成果展節目單</title>
  <style>
    :root{
      --bg:#f6f2ea;
      --text:#16212f;
      --muted:#6a7484;
      --line:rgba(24,33,47,.10);
      --white:#ffffff;
      --heroGrad:linear-gradient(135deg,#fff8ef 0%,#ffffff 32%,#eef8f4 68%,#fff4ec 100%);
      --heroGlow:0 24px 60px rgba(22,33,47,.12);
      --aft1:#3dbf94;
      --aft2:#ffd38e;
      --aft3:#fff1d6;
      --aft4:#fef7ec;
      --aftText:#164f43;
      --eve1:#651fff;
      --eve2:#ff4d6d;
      --eve3:#ffb86b;
      --eve4:#130f24;
      --eveText:#fff2ee;
      --cardShadow:0 16px 34px rgba(18,24,32,.10);
      --cardShadowStrong:0 20px 44px rgba(18,24,32,.16);
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      min-height:100%;
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(61,191,148,.16), transparent 18%),
        radial-gradient(circle at 88% 10%, rgba(255,182,107,.18), transparent 22%),
        radial-gradient(circle at 72% 32%, rgba(101,31,255,.08), transparent 20%),
        linear-gradient(180deg,#fbf8f2 0%,#f5efe7 100%);
    }
    a,button{ -webkit-tap-highlight-color:transparent; }
    .wrap{ max-width:1360px; margin:0 auto; padding:22px 16px 42px; }

    .hero{
      position:relative;
      overflow:hidden;
      border-radius:34px;
      background:var(--heroGrad);
      border:1px solid rgba(255,255,255,.86);
      box-shadow:var(--heroGlow);
      padding:28px 24px 24px;
      isolation:isolate;
    }
    .hero::before,
    .hero::after{
      content:"";
      position:absolute;
      border-radius:999px;
      filter:blur(0px);
      z-index:-1;
    }
    .hero::before{
      width:280px; height:280px;
      right:-60px; top:-90px;
      background:radial-gradient(circle, rgba(255,211,142,.92) 0%, rgba(255,211,142,.10) 62%, transparent 70%);
      opacity:.9;
    }
    .hero::after{
      width:360px; height:360px;
      left:-90px; bottom:-190px;
      background:radial-gradient(circle, rgba(61,191,148,.22) 0%, rgba(61,191,148,.08) 46%, transparent 68%);
      opacity:.95;
    }
    .heroTopBar{
      height:10px;
      border-radius:999px;
      background:linear-gradient(90deg,var(--aft1) 0%, var(--aft2) 38%, #ff8e54 68%, var(--eve1) 100%);
      box-shadow:0 8px 20px rgba(101,31,255,.16);
      margin-bottom:18px;
    }
    .title{
      margin:0;
      font-size:clamp(30px,4.2vw,46px);
      line-height:1.15;
      font-weight:1000;
      letter-spacing:.04em;
      text-shadow:0 1px 0 rgba(255,255,255,.55);
    }
    .metaGrid{
      margin-top:20px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }
    .metaCard{
      position:relative;
      overflow:hidden;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.85);
      background:rgba(255,255,255,.84);
      box-shadow:0 12px 28px rgba(18,24,32,.08);
      padding:16px 16px 15px;
      backdrop-filter:blur(8px);
    }
    .metaCard::before{
      content:"";
      position:absolute; inset:0 auto auto 0;
      width:100%; height:6px;
      background:linear-gradient(90deg,var(--aft1),var(--aft2),#ff8e54);
    }
    .metaCard:nth-child(2)::before{ background:linear-gradient(90deg,#26a17b,#92d8c0,#ffe0ae); }
    .metaCard:nth-child(3)::before{ background:linear-gradient(90deg,#ff9d5c,#ffcd77,#a97dff); }
    .metaLabel{
      font-size:13px;
      color:var(--muted);
      font-weight:1000;
      letter-spacing:.08em;
      margin-bottom:6px;
    }
    .metaValue{
      font-size:18px;
      line-height:1.5;
      font-weight:1000;
    }
    .heroActions{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .actionBtn,
    .downloadBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:11px 18px;
      border-radius:999px;
      border:1px solid rgba(24,33,47,.12);
      background:rgba(255,255,255,.88);
      color:var(--text);
      text-decoration:none;
      font-weight:1000;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(18,24,32,.06);
      transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .actionBtn:hover,
    .downloadBtn:hover{
      transform:translateY(-1px);
      box-shadow:0 12px 22px rgba(18,24,32,.10);
    }
    .actionBtn.primary{
      background:linear-gradient(135deg,#1b9369,#3dbf94);
      border-color:rgba(27,147,105,.28);
      color:#fff;
    }

    .section{
      position:relative;
      margin-top:22px;
      border-radius:32px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.72);
      box-shadow:var(--cardShadowStrong);
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(10px);
    }
    .section::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,.14), transparent 20%);
    }
    .sectionHead{
      position:relative;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      padding:24px 22px 18px;
    }
    .sectionHead::after{
      content:"";
      position:absolute;
      left:22px; right:22px; bottom:0;
      height:1px;
      background:rgba(255,255,255,.28);
    }
    .sectionHead.aft{
      color:var(--aftText);
      background:
        radial-gradient(circle at 8% 18%, rgba(255,255,255,.28), transparent 18%),
        linear-gradient(135deg, #dff7ef 0%, #fff2d2 52%, #fff8ea 100%);
    }
    .sectionHead.eve{
      color:var(--eveText);
      background:
        radial-gradient(circle at 90% 18%, rgba(255,255,255,.16), transparent 16%),
        linear-gradient(135deg, #29194e 0%, #6d1df8 36%, #ff4d6d 72%, #ffae63 100%);
    }
    .sectionTitleWrap{ min-width:0; }
    .sectionKicker{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
      padding:7px 13px;
      border-radius:999px;
      font-size:12px;
      font-weight:1000;
      letter-spacing:.08em;
      text-transform:uppercase;
      backdrop-filter:blur(6px);
    }
    .sectionHead.aft .sectionKicker{
      background:rgba(255,255,255,.55);
      border:1px solid rgba(22,79,67,.08);
      color:#216c5b;
    }
    .sectionHead.eve .sectionKicker{
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.18);
      color:#fff8f3;
    }
    .sectionTitle{
      margin:0;
      font-size:30px;
      line-height:1.1;
      font-weight:1000;
      letter-spacing:.04em;
    }
    .sectionTime{
      margin-top:8px;
      font-size:16px;
      font-weight:1000;
      opacity:.92;
    }
    .sectionActions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .sectionHead.aft .downloadBtn{
      background:rgba(255,255,255,.80);
      color:#155244;
      border-color:rgba(21,82,68,.10);
    }
    .sectionHead.eve .downloadBtn{
      background:rgba(255,255,255,.12);
      color:#fff8f2;
      border-color:rgba(255,255,255,.22);
      box-shadow:0 10px 20px rgba(0,0,0,.10);
    }

    .grid{
      padding:20px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.76));
    }
    .section.eveningSec .grid{
      background:
        linear-gradient(180deg, rgba(28,18,51,.04), rgba(255,255,255,.88));
    }
    .card{
      position:relative;
      overflow:hidden;
      min-height:176px;
      border-radius:26px;
      border:1px solid rgba(24,33,47,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.92));
      padding:18px 18px 16px;
      box-shadow:var(--cardShadow);
      isolation:isolate;
    }
    .card::before{
      content:"";
      position:absolute;
      left:0; right:0; top:0;
      height:10px;
      background:linear-gradient(90deg, var(--aft1) 0%, var(--aft2) 55%, #fff5df 100%);
    }
    .card::after{
      content:"";
      position:absolute;
      right:-30px; bottom:-44px;
      width:150px; height:150px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,211,142,.28) 0%, rgba(255,211,142,.10) 46%, transparent 68%);
      z-index:-1;
    }
    .section.eveningSec .card{
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(252,248,255,.94));
    }
    .section.eveningSec .card::before{
      background:linear-gradient(90deg, var(--eve1) 0%, var(--eve2) 56%, var(--eve3) 100%);
    }
    .section.eveningSec .card::after{
      background:radial-gradient(circle, rgba(101,31,255,.18) 0%, rgba(255,77,109,.08) 46%, transparent 68%);
    }
    .cardTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .num{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:52px;
      height:52px;
      padding:0 14px;
      border-radius:18px;
      background:linear-gradient(135deg,#e7fbf4,#c8f2e2);
      color:#146451;
      font-size:23px;
      font-weight:1000;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.72), 0 10px 18px rgba(61,191,148,.18);
    }
    .section.eveningSec .num{
      background:linear-gradient(135deg, rgba(112,55,255,.15), rgba(255,77,109,.14), rgba(255,180,107,.18));
      color:#7021ff;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.64), 0 10px 18px rgba(101,31,255,.14);
    }
    .joinTag{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      max-width:68%;
      min-height:34px;
      padding:8px 12px;
      border-radius:999px;
      background:linear-gradient(135deg,#fff8db,#ffe8ae);
      color:#8b5a00;
      border:1px solid rgba(243,206,103,.48);
      font-size:12px;
      line-height:1.35;
      font-weight:1000;
      text-align:right;
      box-shadow:0 8px 16px rgba(255,211,142,.20);
    }
    .section.eveningSec .joinTag{
      background:linear-gradient(135deg, rgba(255,238,205,.96), rgba(255,194,120,.92));
      color:#7f3100;
      border-color:rgba(255,189,84,.46);
      box-shadow:0 8px 16px rgba(255,144,85,.18);
    }
    .performer{
      margin-top:20px;
      font-size:28px;
      line-height:1.18;
      font-weight:1000;
      letter-spacing:.02em;
      word-break:break-word;
      white-space:pre-line;
    }
    .song{
      margin-top:10px;
      font-size:18px;
      line-height:1.45;
      font-weight:1000;
      color:#2f3f4f;
      word-break:break-word;
    }
    .instructor{
      margin-top:12px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:34px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(20,100,81,.06);
      color:#2d5d55;
      border:1px solid rgba(20,100,81,.10);
      font-size:14px;
      line-height:1.45;
      font-weight:1000;
      word-break:break-word;
    }
    .section.eveningSec .instructor{
      background:rgba(112,33,255,.06);
      color:#5d2f92;
      border-color:rgba(112,33,255,.10);
    }
    .empty{
      padding:28px 20px 30px;
      color:var(--muted);
      font-size:15px;
      font-weight:1000;
    }
    .footerActions{
      margin-top:18px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:rgba(17,24,39,.92);
      color:#fff;
      padding:12px 16px;
      border-radius:14px;
      font-size:14px;
      font-weight:1000;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      z-index:9999;
    }
    .toast.show{ opacity:1; }

    #exportStage{
      position:fixed;
      left:-300vw;
      top:0;
      width:1080px;
      background:#fff;
      z-index:-1;
      pointer-events:none;
    }
    .exportSheet{
      position:relative;
      overflow:hidden;
      width:1080px;
      height:1080px;
      padding:0;
      box-sizing:border-box;
      color:#1a2432;
      background:linear-gradient(180deg,#fffefb 0%,#fffaf2 100%);
      border:1px solid rgba(24,33,47,.10);
    }
    .exportInner{
      position:absolute;
      left:34px;
      top:30px;
      width:calc(100% - 68px);
      transform-origin:top left;
    }
    .exportSheet::before,
    .exportSheet::after{
      content:"";
      position:absolute;
      border-radius:50%;
      pointer-events:none;
    }
    .exportSheet::before{
      width:280px; height:280px;
      right:-88px; top:-88px;
      opacity:.9;
    }
    .exportSheet::after{
      width:240px; height:240px;
      left:-96px; bottom:-104px;
      opacity:.82;
    }
    .exportSheet.afternoon{
      background:
        radial-gradient(circle at 88% 12%, rgba(255,211,142,.42) 0%, rgba(255,211,142,.12) 26%, transparent 40%),
        radial-gradient(circle at 14% 92%, rgba(61,191,148,.20) 0%, rgba(61,191,148,.08) 28%, transparent 42%),
        linear-gradient(180deg,#fffef9 0%,#fff8ec 100%);
    }
    .exportSheet.afternoon::before{
      background:radial-gradient(circle, rgba(255,211,142,.86) 0%, rgba(255,211,142,.22) 46%, transparent 70%);
    }
    .exportSheet.afternoon::after{
      background:radial-gradient(circle, rgba(61,191,148,.28) 0%, rgba(61,191,148,.10) 44%, transparent 70%);
    }
    .exportSheet.evening{
      color:#ffffff;
      background:
        radial-gradient(circle at 88% 12%, rgba(255,178,98,.28) 0%, rgba(255,178,98,.12) 22%, transparent 38%),
        radial-gradient(circle at 10% 90%, rgba(255,77,109,.22) 0%, rgba(255,77,109,.08) 24%, transparent 40%),
        linear-gradient(180deg,#1b1132 0%,#30175f 30%,#6b1df7 68%,#ff4d6d 100%);
    }
    .exportSheet.evening::before{
      background:radial-gradient(circle, rgba(255,255,255,.14) 0%, rgba(255,255,255,.05) 44%, transparent 70%);
    }
    .exportSheet.evening::after{
      background:radial-gradient(circle, rgba(255,180,107,.22) 0%, rgba(255,180,107,.08) 44%, transparent 70%);
    }
    .exportHeader{
      position:relative;
      overflow:hidden;
      border-radius:24px;
      padding:14px 16px 12px;
      margin-bottom:8px;
      box-shadow:0 18px 36px rgba(18,24,32,.14);
    }
    .exportHeader.afternoon{
      background:linear-gradient(135deg, rgba(255,255,255,.86) 0%, rgba(255,248,225,.94) 48%, rgba(225,248,239,.92) 100%);
      border:1px solid rgba(24,33,47,.08);
      color:#18473e;
    }
    .exportHeader.evening{
      background:linear-gradient(135deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.04) 100%);
      border:1px solid rgba(255,255,255,.16);
      color:#fff8f3;
      backdrop-filter:blur(8px);
    }
    .exportBand{
      height:8px;
      border-radius:999px;
      margin-bottom:8px;
    }
    .exportHeader.afternoon .exportBand{
      background:linear-gradient(90deg,var(--aft1),var(--aft2),#ff9f5b);
    }
    .exportHeader.evening .exportBand{
      background:linear-gradient(90deg,#8a4dff,#ff4d6d,#ffb86b);
    }
    .exportTitle{
      margin:0 0 8px;
      font-size:32px;
      line-height:1.1;
      font-weight:1000;
      letter-spacing:.04em;
    }
    .exportMeta{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
      margin-bottom:8px;
    }
    .exportMetaBox{
      border-radius:14px;
      padding:8px 10px;
      backdrop-filter:blur(5px);
    }
    .exportHeader.afternoon .exportMetaBox{
      background:rgba(255,255,255,.74);
      border:1px solid rgba(24,33,47,.08);
      box-shadow:0 10px 20px rgba(24,33,47,.05);
    }
    .exportHeader.evening .exportMetaBox{
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 12px 24px rgba(0,0,0,.10);
    }
    .exportMetaLabel{
      font-size:10px;
      line-height:1.25;
      font-weight:1000;
      letter-spacing:.08em;
      margin-bottom:3px;
      text-transform:uppercase;
      opacity:.82;
    }
    .exportMetaValue{
      font-size:13px;
      line-height:1.35;
      font-weight:1000;
    }
    .exportScene{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      padding:0 2px 2px;
      margin-bottom:6px;
    }
    .exportSceneTitle{
      font-size:24px;
      line-height:1.12;
      font-weight:1000;
      margin:0;
      letter-spacing:.04em;
    }
    .exportSceneTime{
      font-size:16px;
      line-height:1.3;
      font-weight:1000;
      opacity:.95;
    }
    .exportGrid{
      display:grid;
      gap:7px;
    }
    .exportItem{
      position:relative;
      overflow:hidden;
      border-radius:16px;
      break-inside:avoid;
      box-shadow:0 10px 22px rgba(18,24,32,.10);
    }
    .exportItem::before{
      content:"";
      position:absolute;
      left:0; right:0; top:0;
      height:5px;
    }
    .exportSheet.afternoon .exportItem{
      background:rgba(255,255,255,.90);
      border:1px solid rgba(24,33,47,.08);
      color:#162836;
    }
    .exportSheet.afternoon .exportItem::before{
      background:linear-gradient(90deg,var(--aft1),var(--aft2),#ff9f5b);
    }
    .exportSheet.evening .exportItem{
      background:rgba(255,255,255,.11);
      border:1px solid rgba(255,255,255,.16);
      color:#fffaf6;
      backdrop-filter:blur(6px);
      box-shadow:0 12px 24px rgba(11,8,22,.24);
    }
    .exportSheet.evening .exportItem::before{
      background:linear-gradient(90deg,#8a4dff,#ff4d6d,#ffb86b);
    }
    .exportItemTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding-top:4px;
    }
    .exportNum{
      font-weight:1000;
      line-height:1;
    }
    .exportSheet.afternoon .exportNum{ color:#1c7f62; }
    .exportSheet.evening .exportNum{ color:#ffe0a8; }
    .exportJoin{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:22px;
      padding:4px 8px;
      border-radius:999px;
      font-size:10px;
      line-height:1.3;
      font-weight:1000;
      text-align:right;
    }
    .exportSheet.afternoon .exportJoin{
      background:linear-gradient(135deg,#fff8db,#ffe7a9);
      color:#8a5a00;
      border:1px solid rgba(243,206,103,.54);
    }
    .exportSheet.evening .exportJoin{
      background:linear-gradient(135deg,rgba(255,235,199,.96),rgba(255,193,123,.96));
      color:#783200;
      border:1px solid rgba(255,194,117,.52);
    }
    .exportPerformer{
      margin-top:5px;
      line-height:1.15;
      font-weight:1000;
      word-break:break-word;
      letter-spacing:.02em;
      white-space:pre-line;
    }
    .exportSong{
      margin-top:3px;
      line-height:1.3;
      font-weight:1000;
      word-break:break-word;
      opacity:.98;
    }
    .exportInstructor{
      margin-top:5px;
      display:inline-flex;
      align-items:center;
      min-height:22px;
      padding:4px 8px;
      border-radius:999px;
      line-height:1.35;
      font-weight:1000;
      word-break:break-word;
    }
    .exportSheet.afternoon .exportInstructor{
      background:rgba(20,100,81,.07);
      color:#2d5d55;
      border:1px solid rgba(20,100,81,.12);
    }
    .exportSheet.evening .exportInstructor{
      background:rgba(255,255,255,.10);
      color:#fff5ed;
      border:1px solid rgba(255,255,255,.16);
    }

    @media (max-width:1000px){
      .metaGrid{ grid-template-columns:1fr; }
      .sectionHead{ flex-direction:column; }
      .sectionActions{ justify-content:flex-start; }
      .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:720px){
      .wrap{ padding:16px 12px 30px; }
      .hero{ padding:20px 16px 18px; border-radius:24px; }
      .heroTopBar{ height:8px; margin-bottom:14px; }
      .title{ font-size:30px; }
      .metaValue{ font-size:17px; }
      .section{ border-radius:24px; }
      .sectionHead{ padding:18px 16px 15px; }
      .sectionHead::after{ left:16px; right:16px; }
      .sectionTitle{ font-size:24px; }
      .grid{
        padding:14px;
        grid-template-columns:1fr;
        gap:12px;
      }
      .card{ min-height:auto; padding:16px 16px 14px; border-radius:22px; }
      .num{ min-width:46px; height:46px; font-size:21px; }
      .performer{ font-size:24px; }
      .song{ font-size:17px; }
      .joinTag{ max-width:72%; }
      .exportSheet{ width:1080px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="top">
    <section class="hero">
      <div class="heroTopBar"></div>
      <h1 class="title">柚子樂器音樂成果展節目單</h1>

      <div class="metaGrid">
        <div class="metaCard">
          <div class="metaLabel">活動日期</div>
          <div class="metaValue">2026 年 3 月 29 日（星期日）</div>
        </div>
        <div class="metaCard">
          <div class="metaLabel">活動地點</div>
          <div class="metaValue">豐原太平洋百貨</div>
        </div>
        <div class="metaCard">
          <div class="metaLabel">活動時間</div>
          <div class="metaValue">下午場 13:00–16:00<br>晚上場 17:30–20:30</div>
        </div>
      </div>

      <div class="heroActions">
        <a class="actionBtn primary" href="index.html">回到報名表</a>
        <a class="actionBtn" href="#afternoonSection">下午場</a>
        <a class="actionBtn" href="#eveningSection">晚上場</a>
      </div>
    </section>

    <section class="section" id="afternoonSection">
      <div class="sectionHead aft">
        <div class="sectionTitleWrap">
          <div class="sectionKicker">Afternoon Session</div>
          <h2 class="sectionTitle">下午場節目單</h2>
          <div class="sectionTime">13:00–16:00</div>
        </div>
        <div class="sectionActions">
          <button class="downloadBtn" type="button" id="aftJpgBtn">下載 JPG</button>
          <button class="downloadBtn" type="button" id="aftPdfBtn">下載 PDF</button>
        </div>
      </div>
      <div id="aftGrid" class="grid"></div>
    </section>

    <section class="section eveningSec" id="eveningSection">
      <div class="sectionHead eve">
        <div class="sectionTitleWrap">
          <div class="sectionKicker">Night Session</div>
          <h2 class="sectionTitle">晚上場節目單</h2>
          <div class="sectionTime">17:30–20:30</div>
        </div>
        <div class="sectionActions">
          <button class="downloadBtn" type="button" id="eveJpgBtn">下載 JPG</button>
          <button class="downloadBtn" type="button" id="evePdfBtn">下載 PDF</button>
        </div>
      </div>
      <div id="eveGrid" class="grid"></div>
    </section>

    <div class="footerActions">
      <a class="actionBtn primary" href="#top">回到最上方</a>
    </div>
  </div>

  <div id="exportStage"></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVoYSfoCMhRb2ldlGNLjHas7we5PHEjeAmxgxPUiYy-yuV4cFgPlqTR6nPc-PC8-c/exec";
    const EVENT_DATE = "2026 年 3 月 29 日（星期日）";
    const EVENT_LOCATION = "豐原太平洋百貨";
    const EVENT_TIMES = {
      afternoon: "13:00–16:00",
      evening: "17:30–20:30"
    };

    let aftData = [];
    let eveData = [];

    function esc(s){
      s = String(s ?? "");
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showToast(msg){
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(()=> el.classList.remove("show"), 2200);
    }

    function normalizeTeacherName(name){
      name = String(name || "").trim();
      if(!name) return "";
      return /老師$/.test(name) ? name : (name + "老師");
    }

    function jsonp(url){
      return new Promise((resolve, reject)=>{
        const cb = "cb_" + Math.random().toString(36).slice(2);
        const s = document.createElement("script");
        const timer = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, 15000);
        function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
        window[cb] = (data)=>{ cleanup(); resolve(data); };
        s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
        s.onerror = ()=>{ cleanup(); reject(new Error("load error")); };
        document.body.appendChild(s);
      });
    }

    function cardHtml(it, idx){
      const instructor = it.instructor ? `<div class="instructor">指導老師：${esc(normalizeTeacherName(it.instructor))}</div>` : "";
      const joinTag = it.teacherJoinText ? `<div class="joinTag">${esc(it.teacherJoinText)}</div>` : "";
      return `
        <article class="card">
          <div class="cardTop">
            <div class="num">${idx + 1}</div>
            ${joinTag}
          </div>
          <div class="performer">${esc(it.name || "")}</div>
          <div class="song">${esc(it.song || "")}</div>
          ${instructor}
        </article>
      `;
    }

    function renderGrid(el, list){
      if(!list || !list.length){
        el.innerHTML = `<div class="empty">目前尚無節目資料</div>`;
        return;
      }
      el.innerHTML = list.map((it, idx) => cardHtml(it, idx)).join("");
    }

    function pickExportLayout(count){
      if(count <= 8)  return { cols:2, performer:23, song:16, instructor:12, pad:11, gap:9 };
      if(count <= 16) return { cols:2, performer:18, song:13, instructor:11, pad:9, gap:7 };
      if(count <= 24) return { cols:3, performer:15, song:11, instructor:10, pad:7, gap:6 };
      if(count <= 36) return { cols:4, performer:12, song:10, instructor:9, pad:6, gap:5 };
      if(count <= 48) return { cols:4, performer:10, song:8, instructor:7, pad:4, gap:4 };
      return { cols:5, performer:9, song:7, instructor:6, pad:4, gap:3 };
    }

    function fitExportNode(node){
      const inner = node.querySelector('.exportInner');
      if(!inner) return;
      inner.style.transform = 'scale(1)';
      const availableW = node.clientWidth - 68;
      const availableH = node.clientHeight - 58;
      const neededW = Math.max(inner.scrollWidth, inner.getBoundingClientRect().width);
      const neededH = Math.max(inner.scrollHeight, inner.getBoundingClientRect().height);
      const scale = Math.min(1, availableW / Math.max(neededW, 1), availableH / Math.max(neededH, 1));
      inner.style.transform = `scale(${scale.toFixed(4)})`;
    }

    function buildExportHtml(sceneKey, list){
      const cfg = pickExportLayout((list || []).length || 1);
      const isAfternoon = sceneKey === "afternoon";
      const sceneTitle = isAfternoon ? "下午場節目單" : "晚上場節目單";
      const sceneTime = EVENT_TIMES[sceneKey];
      const sceneClass = isAfternoon ? "afternoon" : "evening";
      const itemsHtml = (list || []).map((it, idx) => {
        const instructor = it.instructor ? `<div class="exportInstructor" style="font-size:${cfg.instructor}px;">指導老師：${esc(normalizeTeacherName(it.instructor))}</div>` : "";
        const join = it.teacherJoinText ? `<div class="exportJoin">${esc(it.teacherJoinText)}</div>` : "";
        return `
          <div class="exportItem" style="padding:${cfg.pad}px;">
            <div class="exportItemTop">
              <div class="exportNum" style="font-size:${Math.max(cfg.performer - 8, 14)}px;">${idx + 1}</div>
              ${join}
            </div>
            <div class="exportPerformer" style="font-size:${cfg.performer}px;">${esc(it.name || "")}</div>
            <div class="exportSong" style="font-size:${cfg.song}px;">${esc(it.song || "")}</div>
            ${instructor}
          </div>
        `;
      }).join("");

      return `
        <div class="exportSheet ${sceneClass}">
          <div class="exportInner">
            <div class="exportHeader ${sceneClass}">
              <div class="exportBand"></div>
              <h1 class="exportTitle">柚子樂器音樂成果展節目單</h1>

              <div class="exportMeta">
                <div class="exportMetaBox">
                  <div class="exportMetaLabel">活動日期</div>
                  <div class="exportMetaValue">${esc(EVENT_DATE)}</div>
                </div>
                <div class="exportMetaBox">
                  <div class="exportMetaLabel">活動地點</div>
                  <div class="exportMetaValue">${esc(EVENT_LOCATION)}</div>
                </div>
                <div class="exportMetaBox">
                  <div class="exportMetaLabel">活動時間</div>
                  <div class="exportMetaValue">${sceneTitle.replace("節目單","")} ${esc(sceneTime)}</div>
                </div>
              </div>
            </div>

            <div class="exportScene">
              <h2 class="exportSceneTitle">${sceneTitle}</h2>
              <div class="exportSceneTime">${sceneTime}</div>
            </div>

            <div class="exportGrid" style="grid-template-columns:repeat(${cfg.cols}, minmax(0, 1fr)); gap:${cfg.gap}px;">
              ${itemsHtml || `<div class="exportItem" style="padding:${cfg.pad}px;">目前尚無節目資料</div>`}
            </div>
          </div>
        </div>
      `;
    }

    async function renderExportCanvas(sceneKey, list){
      const stage = document.getElementById("exportStage");
      stage.innerHTML = buildExportHtml(sceneKey, list);
      await new Promise(r => setTimeout(r, 140));
      const node = stage.firstElementChild;
      fitExportNode(node);
      await new Promise(r => setTimeout(r, 60));
      return await html2canvas(node, {
        scale:2,
        useCORS:true,
        backgroundColor:null
      });
    }

    function triggerDownload(dataUrl, fileName){
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function downloadScene(sceneKey, format){
      const list = sceneKey === "afternoon" ? aftData : eveData;
      const sceneLabel = sceneKey === "afternoon" ? "下午場" : "晚上場";
      if(!window.html2canvas){
        showToast("目前無法產生下載檔案");
        return;
      }
      try{
        showToast("正在準備下載檔案…");
        const canvas = await renderExportCanvas(sceneKey, list);
        if(format === "jpg"){
          triggerDownload(canvas.toDataURL("image/jpeg", 0.96), `柚子樂器成果展節目單_${sceneLabel}.jpg`);
        }else{
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
          const pageW = pdf.internal.pageSize.getWidth();
          const pageH = pdf.internal.pageSize.getHeight();
          const imgW = canvas.width;
          const imgH = canvas.height;
          const ratio = Math.min(pageW / imgW, pageH / imgH);
          const drawW = imgW * ratio;
          const drawH = imgH * ratio;
          const x = (pageW - drawW) / 2;
          const y = (pageH - drawH) / 2;
          pdf.addImage(canvas.toDataURL("image/jpeg", 0.96), "JPEG", x, y, drawW, drawH);
          pdf.save(`柚子樂器成果展節目單_${sceneLabel}.pdf`);
        }
        showToast(`已開始下載 ${sceneLabel}`);
      }catch(err){
        console.error(err);
        showToast("下載失敗，請稍後再試");
      }
    }

    async function loadProgram(){
      try{
        const data = await jsonp(`${SCRIPT_URL}?mode=program`);
        if(!data || !data.ok) throw new Error((data && data.error) || "load failed");
        aftData = Array.isArray(data.afternoon) ? data.afternoon : [];
        eveData = Array.isArray(data.evening) ? data.evening : [];
        renderGrid(document.getElementById("aftGrid"), aftData);
        renderGrid(document.getElementById("eveGrid"), eveData);
      }catch(err){
        console.error(err);
        document.getElementById("aftGrid").innerHTML = `<div class="empty">節目資料載入失敗</div>`;
        document.getElementById("eveGrid").innerHTML = `<div class="empty">節目資料載入失敗</div>`;
      }
    }

    document.getElementById("aftJpgBtn").addEventListener("click", ()=> downloadScene("afternoon", "jpg"));
    document.getElementById("aftPdfBtn").addEventListener("click", ()=> downloadScene("afternoon", "pdf"));
    document.getElementById("eveJpgBtn").addEventListener("click", ()=> downloadScene("evening", "jpg"));
    document.getElementById("evePdfBtn").addEventListener("click", ()=> downloadScene("evening", "pdf"));

    loadProgram();
  </script>
</body>
</html>
