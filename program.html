<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>柚子樂器音樂成果展節目單</title>
  <style>
    :root{
      --bg:#f7f5f2;
      --card:#ffffff;
      --text:#18212b;
      --muted:#667085;
      --line:#e7e2db;
      --brand:#1f7a5a;
      --brand-2:#dff3eb;
      --aft:#e9f7f2;
      --eve:#fff1e8;
      --shadow:0 14px 34px rgba(18, 24, 32, .08);
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top right, rgba(31,122,90,.10), transparent 22%),
        radial-gradient(circle at top left, rgba(241,185,142,.16), transparent 24%),
        var(--bg);
    }
    .wrap{ max-width:1320px; margin:0 auto; padding:22px 16px 40px; }
    .hero{
      background:linear-gradient(135deg, rgba(255,255,255,.98), rgba(247,251,249,.94));
      border:1px solid rgba(231,226,219,.95);
      border-radius:30px;
      box-shadow:var(--shadow);
      padding:26px 24px 22px;
    }
    .title{
      margin:0;
      font-size:clamp(28px, 4vw, 40px);
      line-height:1.25;
      font-weight:1000;
      letter-spacing:.03em;
    }
    .metaGrid{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:14px;
    }
    .metaCard{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 16px;
    }
    .metaLabel{
      font-size:13px;
      color:var(--muted);
      font-weight:900;
      margin-bottom:6px;
    }
    .metaValue{
      font-size:18px;
      font-weight:1000;
      line-height:1.45;
    }
    .heroActions{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .actionBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:11px 16px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      text-decoration:none;
      font-weight:1000;
      cursor:pointer;
    }
    .actionBtn.primary{
      background:var(--brand);
      color:#fff;
      border-color:var(--brand);
    }

    .section{
      margin-top:20px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .sectionHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      padding:20px 20px 16px;
      border-bottom:1px solid rgba(231,226,219,.85);
    }
    .sectionHead.aft{ background:linear-gradient(180deg, var(--aft), rgba(255,255,255,.85)); }
    .sectionHead.eve{ background:linear-gradient(180deg, var(--eve), rgba(255,255,255,.88)); }
    .sectionTitleWrap{ min-width:0; }
    .sectionTitle{
      margin:0;
      font-size:28px;
      line-height:1.2;
      font-weight:1000;
    }
    .sectionTime{
      margin-top:6px;
      font-size:16px;
      color:#314355;
      font-weight:900;
    }
    .sectionActions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .downloadBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      font-weight:1000;
      cursor:pointer;
    }

    .grid{
      padding:18px;
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:16px;
    }
    .card{
      position:relative;
      border-radius:22px;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 8px 20px rgba(18, 24, 32, .05);
      padding:18px 18px 16px;
      min-height:164px;
    }
    .card::before{
      content:"";
      position:absolute;
      left:0; right:0; top:0;
      height:8px;
      border-radius:22px 22px 0 0;
      background:linear-gradient(90deg, rgba(31,122,90,.95), rgba(106,185,149,.88));
    }
    .section.eveningSec .card::before{
      background:linear-gradient(90deg, rgba(217,127,60,.92), rgba(245,173,118,.88));
    }
    .num{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:46px;
      height:46px;
      border-radius:16px;
      background:var(--brand-2);
      color:var(--brand);
      font-size:22px;
      font-weight:1000;
    }
    .section.eveningSec .num{
      background:#fff2e8;
      color:#c56d22;
    }
    .joinTag{
      position:absolute;
      top:16px;
      right:16px;
      max-width:62%;
      padding:7px 10px;
      border-radius:999px;
      background:#fff6df;
      color:#8b5b00;
      border:1px solid #f3de9f;
      font-size:12px;
      line-height:1.4;
      font-weight:1000;
      text-align:right;
    }
    .performer{
      margin-top:18px;
      font-size:26px;
      line-height:1.25;
      font-weight:1000;
      word-break:break-word;
    }
    .song{
      margin-top:10px;
      font-size:18px;
      line-height:1.45;
      font-weight:900;
      color:#263443;
      word-break:break-word;
    }
    .instructor{
      margin-top:12px;
      font-size:14px;
      line-height:1.5;
      color:var(--muted);
      font-weight:900;
      word-break:break-word;
    }
    .empty{
      padding:28px 20px 30px;
      color:var(--muted);
      font-size:15px;
      font-weight:900;
    }

    .footerActions{
      margin-top:18px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:rgba(17,24,39,.92);
      color:#fff;
      padding:12px 16px;
      border-radius:14px;
      font-size:14px;
      font-weight:900;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      z-index:9999;
    }
    .toast.show{ opacity:1; }

    #exportStage{
      position:fixed;
      left:-200vw;
      top:0;
      width:1240px;
      background:#fff;
      z-index:-1;
      pointer-events:none;
    }
    .exportSheet{
      width:1240px;
      min-height:1754px;
      background:#fff;
      color:#15202b;
      padding:56px 58px 48px;
      border:1px solid #e8e2da;
    }
    .exportTitle{
      font-size:38px;
      line-height:1.2;
      font-weight:1000;
      margin:0 0 18px;
      letter-spacing:.03em;
    }
    .exportMeta{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:12px;
      margin-bottom:22px;
    }
    .exportMetaBox{
      border:1px solid #e8e2da;
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
    }
    .exportMetaLabel{
      font-size:13px;
      font-weight:1000;
      color:#667085;
      margin-bottom:4px;
    }
    .exportMetaValue{
      font-size:16px;
      font-weight:1000;
      line-height:1.4;
    }
    .exportScene{
      display:flex;
      align-items:baseline;
      gap:12px;
      margin:4px 0 18px;
    }
    .exportSceneTitle{
      font-size:28px;
      line-height:1.2;
      font-weight:1000;
      margin:0;
    }
    .exportSceneTime{
      font-size:18px;
      line-height:1.4;
      font-weight:900;
      color:#425466;
    }
    .exportGrid{
      display:grid;
      gap:10px;
    }
    .exportItem{
      border:1px solid #e8e2da;
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      break-inside:avoid;
      position:relative;
    }
    .exportItemTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .exportNum{
      font-weight:1000;
      color:#1f7a5a;
      flex:0 0 auto;
    }
    .exportJoin{
      font-size:12px;
      line-height:1.35;
      font-weight:1000;
      color:#8b5b00;
      text-align:right;
    }
    .exportPerformer{
      margin-top:6px;
      font-weight:1000;
      line-height:1.28;
      word-break:break-word;
    }
    .exportSong{
      margin-top:4px;
      line-height:1.4;
      font-weight:900;
      word-break:break-word;
    }
    .exportInstructor{
      margin-top:5px;
      line-height:1.35;
      color:#5f6c7b;
      font-weight:900;
      word-break:break-word;
    }

    @media (max-width:980px){
      .metaGrid{ grid-template-columns:1fr; }
      .sectionHead{ flex-direction:column; }
      .sectionActions{ justify-content:flex-start; }
      .grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width:720px){
      .wrap{ padding:16px 12px 28px; }
      .hero{ padding:20px 16px 18px; border-radius:22px; }
      .metaValue{ font-size:17px; }
      .section{ border-radius:22px; }
      .sectionHead{ padding:16px 16px 14px; }
      .sectionTitle{ font-size:22px; }
      .sectionTime{ font-size:15px; }
      .grid{
        padding:14px;
        grid-template-columns:1fr;
        gap:12px;
      }
      .card{
        padding:16px 16px 14px;
        min-height:auto;
      }
      .performer{ font-size:22px; }
      .song{ font-size:17px; }
      .joinTag{
        position:static;
        display:inline-flex;
        margin-top:12px;
        margin-left:auto;
        max-width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap" id="top">
    <section class="hero">
      <h1 class="title">柚子樂器音樂成果展節目單</h1>

      <div class="metaGrid">
        <div class="metaCard">
          <div class="metaLabel">活動日期</div>
          <div class="metaValue">2026 年 3 月 29 日（星期日）</div>
        </div>
        <div class="metaCard">
          <div class="metaLabel">活動地點</div>
          <div class="metaValue">豐原太平洋百貨</div>
        </div>
        <div class="metaCard">
          <div class="metaLabel">活動時間</div>
          <div class="metaValue">下午場 13:00–16:00<br>晚上場 17:30–20:30</div>
        </div>
      </div>

      <div class="heroActions">
        <a class="actionBtn primary" href="index.html">回到報名表</a>
        <a class="actionBtn" href="#afternoonSection">下午場</a>
        <a class="actionBtn" href="#eveningSection">晚上場</a>
      </div>
    </section>

    <section class="section" id="afternoonSection">
      <div class="sectionHead aft">
        <div class="sectionTitleWrap">
          <h2 class="sectionTitle">下午場節目單</h2>
          <div class="sectionTime">13:00–16:00</div>
        </div>
        <div class="sectionActions">
          <button class="downloadBtn" type="button" id="aftJpgBtn">下載 JPG</button>
          <button class="downloadBtn" type="button" id="aftPdfBtn">下載 PDF</button>
        </div>
      </div>
      <div id="aftGrid" class="grid"></div>
    </section>

    <section class="section eveningSec" id="eveningSection">
      <div class="sectionHead eve">
        <div class="sectionTitleWrap">
          <h2 class="sectionTitle">晚上場節目單</h2>
          <div class="sectionTime">17:30–20:30</div>
        </div>
        <div class="sectionActions">
          <button class="downloadBtn" type="button" id="eveJpgBtn">下載 JPG</button>
          <button class="downloadBtn" type="button" id="evePdfBtn">下載 PDF</button>
        </div>
      </div>
      <div id="eveGrid" class="grid"></div>
    </section>

    <div class="footerActions">
      <a class="actionBtn primary" href="#top">回到最上方</a>
    </div>
  </div>

  <div id="exportStage"></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVoYSfoCMhRb2ldlGNLjHas7we5PHEjeAmxgxPUiYy-yuV4cFgPlqTR6nPc-PC8-c/exec";
    const EVENT_DATE = "2026 年 3 月 29 日（星期日）";
    const EVENT_LOCATION = "豐原太平洋百貨";
    const EVENT_TIMES = {
      afternoon: "13:00–16:00",
      evening: "17:30–20:30"
    };

    let aftData = [];
    let eveData = [];

    function esc(s){
      s = String(s ?? "");
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showToast(msg){
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(()=> el.classList.remove("show"), 2200);
    }

    function normalizeTeacherName(name){
      name = String(name || "").trim();
      if(!name) return "";
      return /老師$/.test(name) ? name : (name + "老師");
    }

    function jsonp(url){
      return new Promise((resolve, reject)=>{
        const cb = "cb_" + Math.random().toString(36).slice(2);
        const s = document.createElement("script");
        const timer = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, 15000);
        function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
        window[cb] = (data)=>{ cleanup(); resolve(data); };
        s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
        s.onerror = ()=>{ cleanup(); reject(new Error("load error")); };
        document.body.appendChild(s);
      });
    }

    function cardHtml(it, idx){
      const instructor = it.instructor ? `<div class="instructor">指導老師：${esc(normalizeTeacherName(it.instructor))}</div>` : "";
      const joinTag = it.teacherJoinText ? `<div class="joinTag">${esc(it.teacherJoinText)}</div>` : "";
      return `
        <article class="card">
          <div class="num">${idx + 1}</div>
          ${joinTag}
          <div class="performer">${esc(it.name || "")}</div>
          <div class="song">${esc(it.song || "")}</div>
          ${instructor}
        </article>
      `;
    }

    function renderGrid(el, list){
      if(!list || !list.length){
        el.innerHTML = `<div class="empty">目前尚無節目資料</div>`;
        return;
      }
      el.innerHTML = list.map((it, idx) => cardHtml(it, idx)).join("");
    }

    function pickExportLayout(count){
      if(count <= 12) return { cols:1, performer:28, song:20, instructor:15, pad:12, gap:12 };
      if(count <= 22) return { cols:2, performer:22, song:16, instructor:13, pad:10, gap:10 };
      if(count <= 32) return { cols:2, performer:18, song:14, instructor:12, pad:8, gap:8 };
      return { cols:3, performer:15, song:12, instructor:11, pad:7, gap:7 };
    }

    function buildExportHtml(sceneKey, list){
      const cfg = pickExportLayout((list || []).length || 1);
      const sceneTitle = sceneKey === "afternoon" ? "下午場節目單" : "晚上場節目單";
      const sceneTime = EVENT_TIMES[sceneKey];
      const itemsHtml = (list || []).map((it, idx) => {
        const instructor = it.instructor ? `<div class="exportInstructor" style="font-size:${cfg.instructor}px;">指導老師：${esc(normalizeTeacherName(it.instructor))}</div>` : "";
        const join = it.teacherJoinText ? `<div class="exportJoin">${esc(it.teacherJoinText)}</div>` : "";
        return `
          <div class="exportItem" style="padding:${cfg.pad}px;">
            <div class="exportItemTop">
              <div class="exportNum" style="font-size:${Math.max(cfg.performer - 8, 14)}px;">${idx + 1}</div>
              ${join}
            </div>
            <div class="exportPerformer" style="font-size:${cfg.performer}px;">${esc(it.name || "")}</div>
            <div class="exportSong" style="font-size:${cfg.song}px;">${esc(it.song || "")}</div>
            ${instructor}
          </div>
        `;
      }).join("");

      return `
        <div class="exportSheet">
          <h1 class="exportTitle">柚子樂器音樂成果展節目單</h1>

          <div class="exportMeta">
            <div class="exportMetaBox">
              <div class="exportMetaLabel">活動日期</div>
              <div class="exportMetaValue">${esc(EVENT_DATE)}</div>
            </div>
            <div class="exportMetaBox">
              <div class="exportMetaLabel">活動地點</div>
              <div class="exportMetaValue">${esc(EVENT_LOCATION)}</div>
            </div>
            <div class="exportMetaBox">
              <div class="exportMetaLabel">活動時間</div>
              <div class="exportMetaValue">${sceneTitle.replace("節目單","")} ${esc(sceneTime)}</div>
            </div>
          </div>

          <div class="exportScene">
            <h2 class="exportSceneTitle">${sceneTitle}</h2>
            <div class="exportSceneTime">${sceneTime}</div>
          </div>

          <div class="exportGrid" style="grid-template-columns:repeat(${cfg.cols}, minmax(0, 1fr)); gap:${cfg.gap}px;">
            ${itemsHtml || `<div class="exportItem">目前尚無節目資料</div>`}
          </div>
        </div>
      `;
    }

    async function renderExportCanvas(sceneKey, list){
      const stage = document.getElementById("exportStage");
      stage.innerHTML = buildExportHtml(sceneKey, list);
      await new Promise(r => setTimeout(r, 120));
      const node = stage.firstElementChild;
      return await html2canvas(node, {
        scale:2,
        useCORS:true,
        backgroundColor:"#ffffff"
      });
    }

    function triggerDownload(dataUrl, fileName){
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function downloadScene(sceneKey, format){
      const list = sceneKey === "afternoon" ? aftData : eveData;
      const sceneLabel = sceneKey === "afternoon" ? "下午場" : "晚上場";
      if(!window.html2canvas){
        showToast("目前無法產生下載檔案");
        return;
      }
      try{
        showToast("正在準備下載檔案…");
        const canvas = await renderExportCanvas(sceneKey, list);
        if(format === "jpg"){
          triggerDownload(canvas.toDataURL("image/jpeg", 0.96), `柚子樂器成果展節目單_${sceneLabel}.jpg`);
        }else{
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
          const pageW = pdf.internal.pageSize.getWidth();
          const pageH = pdf.internal.pageSize.getHeight();
          const imgW = canvas.width;
          const imgH = canvas.height;
          const ratio = Math.min(pageW / imgW, pageH / imgH);
          const drawW = imgW * ratio;
          const drawH = imgH * ratio;
          const x = (pageW - drawW) / 2;
          const y = (pageH - drawH) / 2;
          pdf.addImage(canvas.toDataURL("image/jpeg", 0.96), "JPEG", x, y, drawW, drawH);
          pdf.save(`柚子樂器成果展節目單_${sceneLabel}.pdf`);
        }
        showToast(`已開始下載 ${sceneLabel}`);
      }catch(err){
        console.error(err);
        showToast("下載失敗，請稍後再試");
      }
    }

    async function loadProgram(){
      try{
        const data = await jsonp(`${SCRIPT_URL}?mode=program`);
        if(!data || !data.ok) throw new Error((data && data.error) || "load failed");
        aftData = Array.isArray(data.afternoon) ? data.afternoon : [];
        eveData = Array.isArray(data.evening) ? data.evening : [];
        renderGrid(document.getElementById("aftGrid"), aftData);
        renderGrid(document.getElementById("eveGrid"), eveData);
      }catch(err){
        console.error(err);
        document.getElementById("aftGrid").innerHTML = `<div class="empty">節目資料載入失敗</div>`;
        document.getElementById("eveGrid").innerHTML = `<div class="empty">節目資料載入失敗</div>`;
      }
    }

    document.getElementById("aftJpgBtn").addEventListener("click", ()=> downloadScene("afternoon", "jpg"));
    document.getElementById("aftPdfBtn").addEventListener("click", ()=> downloadScene("afternoon", "pdf"));
    document.getElementById("eveJpgBtn").addEventListener("click", ()=> downloadScene("evening", "jpg"));
    document.getElementById("evePdfBtn").addEventListener("click", ()=> downloadScene("evening", "pdf"));

    loadProgram();
  </script>
</body>
</html>
