<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>柚子樂器音樂成果展｜節目單</title>
  <style>
    :root{
      --bg:#f5f2ec;
      --card:#ffffff;
      --line:#e8e3da;
      --text:#1f2937;
      --muted:#6b7280;
      --brand:#155e4b;
      --brand-2:#2f8f6b;
      --soft:#eef8f3;
      --soft-2:#fff8eb;
      --gold:#c79b35;
      --aft:#eef7ff;
      --eve:#fff3f0;
      --shadow:0 14px 38px rgba(17,24,39,.08);
      --radius:24px;
    }
    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      color:var(--text);
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.85), transparent 24%),
        linear-gradient(180deg, #faf7f2 0%, #f4efe8 100%);
    }
    .wrap{ max-width:1360px; margin:0 auto; padding:22px 18px 42px; }

    .hero{
      position:relative;
      overflow:hidden;
      border:1px solid #eadfce;
      border-radius:32px;
      background:
        linear-gradient(135deg, rgba(21,94,75,.96) 0%, rgba(47,143,107,.92) 52%, rgba(199,155,53,.72) 100%);
      color:#fff;
      box-shadow:0 18px 44px rgba(21,94,75,.18);
      padding:28px 26px 24px;
    }
    .hero:before,
    .hero:after{
      content:"";
      position:absolute;
      border-radius:50%;
      pointer-events:none;
      opacity:.18;
      background:rgba(255,255,255,.35);
      filter:blur(2px);
    }
    .hero:before{ width:220px; height:220px; right:-50px; top:-70px; }
    .hero:after{ width:170px; height:170px; left:-40px; bottom:-80px; }
    .heroTop{
      position:relative;
      z-index:1;
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .titleBlock h1{
      margin:0;
      font-size:clamp(28px,4vw,42px);
      line-height:1.2;
      letter-spacing:.04em;
      font-weight:1000;
    }
    .subLine{
      margin-top:8px;
      font-size:14px;
      opacity:.92;
      letter-spacing:.12em;
      font-weight:800;
    }
    .heroActions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-self:flex-end;
    }
    .btn{
      appearance:none;
      border:none;
      text-decoration:none;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:44px;
      padding:0 16px;
      border-radius:999px;
      font-size:14px;
      font-weight:1000;
      transition:transform .15s ease, opacity .15s ease, box-shadow .15s ease;
    }
    .btn:hover{ transform:translateY(-1px); }
    .btnPrimary{ background:#fff; color:var(--brand); box-shadow:0 10px 24px rgba(0,0,0,.12); }
    .btnGhost{ background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28); }

    .heroInfo{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:14px;
      margin-top:22px;
    }
    .infoCard{
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
      border-radius:22px;
      padding:16px 18px;
      backdrop-filter:blur(4px);
    }
    .infoLabel{
      font-size:13px;
      letter-spacing:.08em;
      font-weight:900;
      opacity:.88;
    }
    .infoValue{
      margin-top:7px;
      font-size:18px;
      line-height:1.55;
      font-weight:1000;
    }

    .section{
      margin-top:18px;
      background:rgba(255,255,255,.92);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:18px;
    }
    .sectionHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
      flex-wrap:wrap;
    }
    .sectionTitle{
      margin:0;
      font-size:26px;
      font-weight:1000;
      line-height:1.2;
    }
    .timePill{
      padding:10px 16px;
      border-radius:999px;
      font-size:14px;
      font-weight:1000;
      white-space:nowrap;
      border:1px solid transparent;
    }
    .aftTheme{ background:linear-gradient(180deg, #f8fcff, #eef7ff); }
    .aftTheme .timePill{ background:#dfefff; border-color:#c9def5; color:#1d4d76; }
    .eveTheme{ background:linear-gradient(180deg, #fffaf8, #fff3f0); }
    .eveTheme .timePill{ background:#ffe5dc; border-color:#f6cfc1; color:#93462a; }

    .programGrid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:16px;
    }
    .programCard{
      position:relative;
      min-height:184px;
      border-radius:24px;
      background:#fff;
      border:1px solid #ebe6dd;
      box-shadow:0 12px 26px rgba(15,23,42,.05);
      padding:18px 18px 16px;
      overflow:hidden;
    }
    .programCard:before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:7px;
      background:linear-gradient(180deg, var(--brand) 0%, var(--brand-2) 100%);
    }
    .cardTop{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:14px;
    }
    .numBadge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:52px;
      height:52px;
      border-radius:16px;
      background:linear-gradient(180deg, var(--soft), #e4f2eb);
      color:var(--brand);
      font-size:22px;
      font-weight:1000;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
    }
    .teacherTag{
      max-width:72%;
      padding:8px 12px;
      border-radius:999px;
      background:#fdf6df;
      border:1px solid #efd99a;
      color:#8a6413;
      font-size:12px;
      font-weight:1000;
      line-height:1.35;
      text-align:right;
    }
    .performer{
      font-size:24px;
      line-height:1.3;
      font-weight:1000;
      letter-spacing:.02em;
    }
    .songLabel{
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
      font-weight:900;
      letter-spacing:.08em;
    }
    .songName{
      margin-top:4px;
      font-size:18px;
      line-height:1.45;
      font-weight:900;
    }

    .emptyState{
      padding:18px 10px;
      color:var(--muted);
      font-weight:900;
    }

    .posterWrap{ display:grid; gap:18px; }
    .posterCard{
      background:#fff;
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:18px;
    }
    .posterToolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }
    .posterTitle{
      margin:0;
      font-size:24px;
      font-weight:1000;
    }
    .toolBtns{ display:flex; flex-wrap:wrap; gap:10px; }
    .btnPoster{
      background:#ffffff;
      color:var(--brand);
      border:1px solid #d8e7df;
      box-shadow:0 8px 20px rgba(21,94,75,.08);
    }

    .poster{
      width:100%;
      max-width:1120px;
      margin:0 auto;
      background:#fff;
      border:1px solid #efe5d6;
      border-radius:28px;
      overflow:hidden;
    }
    .posterHead{
      padding:26px 28px 20px;
      color:#fff;
      background:linear-gradient(135deg, rgba(21,94,75,.98) 0%, rgba(47,143,107,.94) 62%, rgba(199,155,53,.8) 100%);
    }
    .posterHead h3{
      margin:0;
      font-size:36px;
      line-height:1.2;
      font-weight:1000;
      letter-spacing:.04em;
    }
    .posterSub{
      margin-top:8px;
      font-size:16px;
      line-height:1.7;
      font-weight:800;
      opacity:.95;
    }
    .posterSession{
      display:inline-flex;
      margin-top:14px;
      padding:10px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
      font-weight:1000;
      font-size:16px;
    }
    .posterBody{
      padding:22px 22px 24px;
      background:linear-gradient(180deg, #fffdf9, #fff);
    }
    .posterColumns{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:16px;
    }
    .posterCol{
      border:1px solid #eee6d9;
      border-radius:20px;
      overflow:hidden;
      background:#fff;
    }
    .posterRow{
      display:grid;
      grid-template-columns:72px minmax(0, 1fr);
      gap:12px;
      align-items:flex-start;
      padding:14px 16px;
      border-bottom:1px solid #f1ebdf;
    }
    .posterRow:last-child{ border-bottom:none; }
    .posterRow:nth-child(even){ background:#fffaf0; }
    .posterNo{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      border-radius:14px;
      background:#eff7f2;
      color:var(--brand);
      font-size:22px;
      font-weight:1000;
    }
    .posterPerformer{
      font-size:20px;
      line-height:1.35;
      font-weight:1000;
      color:#14212d;
    }
    .posterSong{
      margin-top:6px;
      font-size:15px;
      line-height:1.5;
      font-weight:800;
      color:#374151;
    }
    .posterTeacher{
      margin-top:8px;
      display:inline-flex;
      padding:6px 10px;
      border-radius:999px;
      background:#fdf6df;
      border:1px solid #efd99a;
      color:#8a6413;
      font-size:12px;
      font-weight:1000;
    }

    .helperError{
      display:none;
      margin-top:14px;
      padding:12px 14px;
      border-radius:16px;
      background:#fff1f2;
      border:1px solid #fecdd3;
      color:#b42318;
      font-weight:900;
    }

    @media (max-width:1100px){
      .heroInfo{ grid-template-columns:1fr; }
      .programGrid{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
      .posterColumns{ grid-template-columns:1fr; }
    }
    @media (max-width:720px){
      .wrap{ padding:14px 12px 34px; }
      .hero{ padding:22px 16px 18px; border-radius:24px; }
      .section,.posterCard{ padding:14px; border-radius:22px; }
      .programGrid{ grid-template-columns:1fr; gap:12px; }
      .programCard{ min-height:auto; padding:16px 14px 15px; }
      .numBadge{ min-width:46px; height:46px; font-size:20px; }
      .performer{ font-size:22px; }
      .songName{ font-size:17px; }
      .posterHead{ padding:18px 16px 16px; }
      .posterHead h3{ font-size:24px; }
      .posterSub{ font-size:14px; }
      .posterBody{ padding:12px; }
      .posterRow{ grid-template-columns:58px minmax(0,1fr); gap:10px; padding:12px 12px; }
      .posterNo{ font-size:18px; min-height:42px; }
      .posterPerformer{ font-size:17px; }
      .posterSong{ font-size:14px; }
      .sectionTitle,.posterTitle{ font-size:22px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="top">
    <section class="hero">
      <div class="heroTop">
        <div class="titleBlock">
          <h1>柚子樂器音樂成果展節目單</h1>
          <div class="subLine">YUZU MUSIC RECITAL PROGRAM</div>
        </div>
        <div class="heroActions">
          <a class="btn btnPrimary" href="#posterAfternoon">下午場歌單</a>
          <a class="btn btnGhost" href="#posterEvening">晚上場歌單</a>
        </div>
      </div>

      <div class="heroInfo">
        <div class="infoCard">
          <div class="infoLabel">活動日期</div>
          <div class="infoValue">2026 年 3 月 29 日（星期日）</div>
        </div>
        <div class="infoCard">
          <div class="infoLabel">活動地點</div>
          <div class="infoValue">豐原太平洋百貨</div>
        </div>
        <div class="infoCard">
          <div class="infoLabel">活動時間</div>
          <div class="infoValue">下午場 13:00–16:00<br>晚上場 17:30–20:30</div>
        </div>
      </div>
    </section>

    <section class="section aftTheme">
      <div class="sectionHead">
        <h2 class="sectionTitle">下午場節目單｜13:00–16:00</h2>
        <div class="timePill">Afternoon Session</div>
      </div>
      <div id="afternoonGrid" class="programGrid"></div>
    </section>

    <section class="section eveTheme">
      <div class="sectionHead">
        <h2 class="sectionTitle">晚上場節目單｜17:30–20:30</h2>
        <div class="timePill">Evening Session</div>
      </div>
      <div id="eveningGrid" class="programGrid"></div>
    </section>

    <section class="section">
      <div class="sectionHead">
        <h2 class="sectionTitle">海報版歌單</h2>
      </div>
      <div class="posterWrap">
        <div class="posterCard" id="posterAfternoonWrap">
          <div class="posterToolbar">
            <h3 class="posterTitle">下午場歌單海報｜13:00–16:00</h3>
            <div class="toolBtns">
              <button class="btn btnPoster" type="button" data-export="jpg" data-target="posterAfternoon">下載 JPG</button>
              <button class="btn btnPoster" type="button" data-export="pdf" data-target="posterAfternoon">下載 PDF</button>
            </div>
          </div>
          <div class="poster" id="posterAfternoon"></div>
        </div>

        <div class="posterCard" id="posterEveningWrap">
          <div class="posterToolbar">
            <h3 class="posterTitle">晚上場歌單海報｜17:30–20:30</h3>
            <div class="toolBtns">
              <button class="btn btnPoster" type="button" data-export="jpg" data-target="posterEvening">下載 JPG</button>
              <button class="btn btnPoster" type="button" data-export="pdf" data-target="posterEvening">下載 PDF</button>
            </div>
          </div>
          <div class="poster" id="posterEvening"></div>
        </div>
      </div>
      <div id="errorBox" class="helperError"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVoYSfoCMhRb2ldlGNLjHas7we5PHEjeAmxgxPUiYy-yuV4cFgPlqTR6nPc-PC8-c/exec";

    function esc(s){
      s = String(s ?? "");
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function jsonp(url){
      return new Promise((resolve, reject)=>{
        const cb = "cb_" + Math.random().toString(36).slice(2);
        const s = document.createElement("script");
        const timer = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, 20000);
        function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
        window[cb] = (data)=>{ cleanup(); resolve(data); };
        s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
        s.onerror = ()=>{ cleanup(); reject(new Error("load error")); };
        document.body.appendChild(s);
      });
    }

    function parseTimeValue(v){
      if(v == null || v === "") return Number.MAX_SAFE_INTEGER;
      if(typeof v === "number") return v;
      const t = new Date(v).getTime();
      return Number.isFinite(t) ? t : Number.MAX_SAFE_INTEGER;
    }

    function formatTeacherLabel(name){
      const raw = String(name || "").trim();
      if(!raw) return "老師一同表演";
      return /老師$/.test(raw) ? `${raw}一同表演` : `${raw}老師一同表演`;
    }

    function canShowTeacher(item){
      return !!(item && (item.withTeacher || String(item.teacherName || "").trim()));
    }

    function wouldExceedMax(list, item, maxConsecutive){
      const type = String(item.type || "").trim();
      if(!type || !list.length) return false;
      let streak = 0;
      for(let i = list.length - 1; i >= 0; i--){
        const prevType = String(list[i].type || "").trim();
        if(prevType === type) streak++;
        else break;
      }
      return streak >= maxConsecutive;
    }

    function reorderByTypeAndTime(list, maxConsecutive){
      const remaining = list.slice();
      const result = [];
      while(remaining.length){
        let pickIndex = remaining.findIndex(item => !wouldExceedMax(result, item, maxConsecutive));
        if(pickIndex < 0) pickIndex = 0;
        result.push(remaining.splice(pickIndex, 1)[0]);
      }
      return result;
    }

    function arrangeProgram(list){
      const normalized = (list || []).map((item, index)=>({
        ...item,
        _index:index,
        _created:parseTimeValue(item.createdAt)
      }));

      normalized.sort((a,b)=>{
        if(a._created !== b._created) return a._created - b._created;
        return a._index - b._index;
      });

      const front = [];
      const middle = [];
      const back = [];

      normalized.forEach(item=>{
        const frontPref = !!item.front && !item.back;
        const backPref = !!item.back && !item.front;
        if(frontPref) front.push(item);
        else if(backPref) back.push(item);
        else middle.push(item);
      });

      const orderedFront = reorderByTypeAndTime(front, 3);
      const orderedMiddle = reorderByTypeAndTime(middle, 3);
      const orderedBack = reorderByTypeAndTime(back, 3);
      return orderedFront.concat(orderedMiddle, orderedBack);
    }

    function renderCards(list){
      if(!list || !list.length){
        return `<div class="emptyState">目前尚無節目資料</div>`;
      }
      return list.map((item, idx)=>{
        const teacher = canShowTeacher(item) ? `<div class="teacherTag">${esc(formatTeacherLabel(item.teacherName))}</div>` : ``;
        return `
          <article class="programCard">
            <div class="cardTop">
              <div class="numBadge">${idx + 1}</div>
              ${teacher}
            </div>
            <div class="performer">${esc(item.name || "")}</div>
            <div class="songLabel">演出曲目</div>
            <div class="songName">${esc(item.song || "")}</div>
          </article>
        `;
      }).join("");
    }

    function splitPosterColumns(list){
      const half = Math.ceil((list || []).length / 2);
      return [list.slice(0, half), list.slice(half)];
    }

    function renderPoster(targetId, sessionTitle, sessionTime, list){
      const target = document.getElementById(targetId);
      if(!target) return;

      if(!list || !list.length){
        target.innerHTML = `
          <div class="posterHead">
            <h3>柚子樂器音樂成果展節目單</h3>
            <div class="posterSub">活動日期｜2026 年 3 月 29 日（星期日）<br>活動地點｜豐原太平洋百貨</div>
            <div class="posterSession">${esc(sessionTitle)}｜${esc(sessionTime)}</div>
          </div>
          <div class="posterBody"><div class="emptyState">目前尚無節目資料</div></div>
        `;
        return;
      }

      const [left, right] = splitPosterColumns(list);
      const renderCol = (col, startIndex) => {
        if(!col.length) return `<div class="posterCol"></div>`;
        return `
          <div class="posterCol">
            ${col.map((item, idx)=>{
              const teacher = canShowTeacher(item)
                ? `<div class="posterTeacher">${esc(formatTeacherLabel(item.teacherName))}</div>`
                : ``;
              return `
                <div class="posterRow">
                  <div class="posterNo">${startIndex + idx}</div>
                  <div>
                    <div class="posterPerformer">${esc(item.name || "")}</div>
                    <div class="posterSong">${esc(item.song || "")}</div>
                    ${teacher}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      };

      target.innerHTML = `
        <div class="posterHead">
          <h3>柚子樂器音樂成果展節目單</h3>
          <div class="posterSub">活動日期｜2026 年 3 月 29 日（星期日）<br>活動地點｜豐原太平洋百貨</div>
          <div class="posterSession">${esc(sessionTitle)}｜${esc(sessionTime)}</div>
        </div>
        <div class="posterBody">
          <div class="posterColumns">
            ${renderCol(left, 1)}
            ${renderCol(right, left.length + 1)}
          </div>
        </div>
      `;
    }

    async function exportAsImage(elementId, filenameBase){
      const node = document.getElementById(elementId);
      if(!node) throw new Error("找不到輸出區塊");
      if(typeof html2canvas !== "function") throw new Error("下載套件未載入完成");
      const canvas = await html2canvas(node, {
        backgroundColor: "#ffffff",
        scale: 2,
        useCORS: true,
        logging: false
      });
      const link = document.createElement("a");
      link.download = `${filenameBase}.jpg`;
      link.href = canvas.toDataURL("image/jpeg", 0.96);
      link.click();
    }

    async function exportAsPdf(elementId, filenameBase){
      const node = document.getElementById(elementId);
      if(!node) throw new Error("找不到輸出區塊");
      if(typeof html2canvas !== "function") throw new Error("下載套件未載入完成");
      if(!window.jspdf || !window.jspdf.jsPDF) throw new Error("PDF 套件未載入完成");

      const canvas = await html2canvas(node, {
        backgroundColor: "#ffffff",
        scale: 2,
        useCORS: true,
        logging: false
      });
      const img = canvas.toDataURL("image/jpeg", 0.96);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: canvas.width > canvas.height ? "l" : "p", unit: "pt", format: [canvas.width, canvas.height] });
      pdf.addImage(img, "JPEG", 0, 0, canvas.width, canvas.height);
      pdf.save(`${filenameBase}.pdf`);
    }

    function bindExportButtons(){
      document.querySelectorAll("[data-export]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const kind = btn.dataset.export;
          const target = btn.dataset.target;
          const filenameBase = target === "posterAfternoon" ? "柚子樂器成果展_下午場節目單" : "柚子樂器成果展_晚上場節目單";
          const original = btn.textContent;
          btn.disabled = true;
          btn.style.opacity = .7;
          btn.textContent = kind === "jpg" ? "下載中…" : "轉出中…";
          try{
            if(kind === "jpg") await exportAsImage(target, filenameBase);
            else await exportAsPdf(target, filenameBase);
          }catch(err){
            showError(err.message || String(err));
          }finally{
            btn.disabled = false;
            btn.style.opacity = 1;
            btn.textContent = original;
          }
        });
      });
    }

    function showError(message){
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = `載入或下載失敗：${message}`;
    }

    async function loadProgram(){
      try{
        const data = await jsonp(SCRIPT_URL + "?mode=program");
        if(!data || !data.ok) throw new Error((data && data.error) || "讀取失敗");

        const afternoon = arrangeProgram(data.afternoon || []);
        const evening = arrangeProgram(data.evening || []);

        document.getElementById("afternoonGrid").innerHTML = renderCards(afternoon);
        document.getElementById("eveningGrid").innerHTML = renderCards(evening);

        renderPoster("posterAfternoon", "下午場節目單", "13:00–16:00", afternoon);
        renderPoster("posterEvening", "晚上場節目單", "17:30–20:30", evening);
      }catch(err){
        showError(err.message || String(err));
        document.getElementById("afternoonGrid").innerHTML = `<div class="emptyState">目前無法載入節目單</div>`;
        document.getElementById("eveningGrid").innerHTML = `<div class="emptyState">目前無法載入節目單</div>`;
      }
    }

    bindExportButtons();
    loadProgram();
  </script>
</body>
</html>
